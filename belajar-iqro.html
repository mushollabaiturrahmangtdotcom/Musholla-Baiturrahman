<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belajar Iqro — Musholla Baiturrahman</title>
<link rel="icon" type="image/png" href="images/musholla.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green-deep:#0d3b2e;--green-mid:#155f45;--green-bright:#1e8a5e;--green-light:#2db87a;--gold:#c9a84c;--gold-light:#e8c97a;--cream:#f9f5ee;--cream-dark:#ede8dc;--white:#ffffff;--text-dark:#1a1a1a;--text-mid:#4a4a4a;--text-light:#7a7a7a;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--text-dark);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(13,59,46,0.97);backdrop-filter:blur(12px);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;border-bottom:1px solid rgba(201,168,76,0.3);}
  .nav-brand{display:flex;align-items:center;gap:12px;text-decoration:none;}
  .nav-brand img{height:38px;width:auto;}
  .nav-brand span{font-size:0.85rem;font-weight:600;color:var(--white);}
  .nav-back{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,0.8);text-decoration:none;font-size:0.82rem;font-weight:500;padding:7px 14px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);transition:all 0.2s;}
  .nav-back:hover{background:rgba(255,255,255,0.1);color:var(--gold-light);}
  .main-layout{display:flex;height:calc(100vh - 64px);margin-top:64px;}
  .sidebar{width:260px;flex-shrink:0;background:var(--white);border-right:1px solid var(--cream-dark);display:flex;flex-direction:column;}
  .sidebar-header{padding:16px;background:linear-gradient(135deg,var(--green-deep),var(--green-mid));flex-shrink:0;}
  .sidebar-header h2{font-family:'Amiri',serif;font-size:1.2rem;color:var(--white);margin-bottom:4px;}
  .sidebar-header p{font-size:0.72rem;color:rgba(255,255,255,0.6);}
  .level-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px;}
  .level-tab{flex:1;min-width:58px;padding:8px 4px;border-radius:8px;border:1.5px solid var(--cream-dark);background:var(--cream);font-size:0.78rem;font-weight:700;color:var(--text-mid);cursor:pointer;transition:all 0.2s;text-align:center;}
  .level-tab:hover{border-color:var(--green-bright);color:var(--green-bright);}
  .level-tab.aktif{background:var(--green-deep);color:var(--white);border-color:var(--green-deep);}
  .halaman-list{flex:1;overflow-y:auto;padding:6px;}
  .halaman-list::-webkit-scrollbar{width:4px;}
  .halaman-list::-webkit-scrollbar-thumb{background:var(--cream-dark);border-radius:2px;}
  .hal-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;border:none;width:100%;text-align:left;background:transparent;transition:background 0.15s;}
  .hal-item:hover{background:rgba(30,138,94,0.08);}
  .hal-item.aktif{background:var(--green-deep);}
  .hal-item.aktif .hi-num,.hal-item.aktif .hi-title,.hal-item.aktif .hi-sub{color:var(--white)!important;}
  .hal-item.aktif .hi-num{background:rgba(255,255,255,0.15);}
  .hi-num{width:30px;height:30px;flex-shrink:0;background:rgba(30,138,94,0.1);border-radius:6px;display:grid;place-items:center;font-size:0.72rem;font-weight:700;color:var(--green-bright);}
  .hi-text{flex:1;min-width:0;}
  .hi-title{font-size:0.83rem;font-weight:600;color:var(--text-dark);}
  .hi-sub{font-size:0.68rem;color:var(--text-light);margin-top:1px;}
  .hi-done{font-size:0.9rem;flex-shrink:0;}
  .content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .content-header{padding:14px 24px;background:linear-gradient(135deg,var(--green-deep),var(--green-mid));flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .ch-left h3{font-family:'Amiri',serif;font-size:1.15rem;color:var(--white);}
  .ch-left p{font-size:0.72rem;color:rgba(255,255,255,0.6);margin-top:2px;}
  .ch-progress{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .progress-bar-wrap{width:90px;height:6px;background:rgba(255,255,255,0.2);border-radius:3px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:var(--gold);border-radius:3px;transition:width 0.4s;}
  .progress-text{font-size:0.7rem;color:rgba(255,255,255,0.65);white-space:nowrap;}
  .huruf-area{flex:1;overflow-y:auto;padding:18px 22px;}
  .huruf-area::-webkit-scrollbar{width:5px;}
  .huruf-area::-webkit-scrollbar-thumb{background:var(--cream-dark);border-radius:3px;}
  .halaman-intro{background:var(--white);border-radius:12px;padding:14px 18px;margin-bottom:14px;border:1px solid var(--cream-dark);display:flex;align-items:flex-start;gap:12px;}
  .intro-icon{font-size:1.6rem;flex-shrink:0;margin-top:2px;}
  .intro-text h4{font-size:0.88rem;font-weight:700;color:var(--green-deep);margin-bottom:3px;}
  .intro-text p{font-size:0.76rem;color:var(--text-mid);line-height:1.6;}
  .huruf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:18px;}
  .huruf-card{background:var(--white);border-radius:12px;padding:14px 10px;text-align:center;border:2px solid var(--cream-dark);cursor:pointer;transition:all 0.2s;position:relative;user-select:none;}
  .huruf-card:hover{border-color:var(--green-bright);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,0.08);}
  .huruf-card.playing{border-color:var(--gold);background:rgba(201,168,76,0.06);}
  .hc-arab{font-family:'Amiri',serif;font-size:2rem;color:var(--green-deep);line-height:1.2;margin-bottom:5px;}
  .hc-latin{font-size:0.7rem;font-weight:600;color:var(--text-mid);letter-spacing:0.03em;}
  .hc-speaker{font-size:0.75rem;margin-top:6px;opacity:0.45;}
  .latihan-section{margin-top:4px;}
  .latihan-title{font-size:0.72rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--green-bright);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .latihan-title::after{content:'';flex:1;height:1px;background:var(--cream-dark);}
  .latihan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
  .latihan-card{background:var(--white);border-radius:10px;padding:12px 10px;text-align:center;border:1.5px solid var(--cream-dark);cursor:pointer;transition:all 0.2s;}
  .latihan-card:hover{border-color:var(--green-bright);box-shadow:0 3px 10px rgba(0,0,0,0.06);}
  .latihan-card.playing{border-color:var(--gold);background:rgba(201,168,76,0.05);}
  .lc-arab{font-family:'Amiri',serif;font-size:1.45rem;color:var(--text-dark);direction:rtl;margin-bottom:4px;line-height:1.5;}
  .lc-latin{font-size:0.68rem;color:var(--text-light);font-style:italic;}
  .bottom-nav{padding:10px 22px;border-top:1px solid var(--cream-dark);background:var(--white);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;}
  .nav-btn{padding:8px 18px;border-radius:8px;border:1.5px solid var(--cream-dark);background:var(--white);font-size:0.78rem;font-weight:600;color:var(--green-deep);cursor:pointer;transition:all 0.2s;}
  .nav-btn:hover:not(:disabled){background:var(--green-deep);color:var(--white);border-color:var(--green-deep);}
  .nav-btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn-selesai{padding:8px 18px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;font-size:0.78rem;font-weight:700;color:var(--green-deep);cursor:pointer;transition:all 0.2s;}
  .btn-selesai:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(201,168,76,0.4);}
  .btn-selesai.done{background:linear-gradient(135deg,var(--green-bright),var(--green-light));color:var(--white);}
  .placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px;}
  .placeholder h3{font-family:'Amiri',serif;font-size:1.4rem;color:var(--green-deep);}
  .placeholder p{font-size:0.85rem;color:var(--text-light);line-height:1.7;max-width:340px;}
  .level-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.68rem;font-weight:700;background:rgba(201,168,76,0.15);color:#8a6b1e;margin-top:6px;}
  @media(max-width:768px){.sidebar{width:220px;}nav .nav-brand span{display:none;}.huruf-grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));}}
  @media(max-width:520px){.main-layout{flex-direction:column;}.sidebar{width:100%;height:auto;border-right:none;border-bottom:1px solid var(--cream-dark);}.halaman-list{display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;max-height:56px;}.hal-item{min-width:80px;flex-direction:column;align-items:center;gap:1px;}.hi-sub{display:none;}.huruf-area{padding:10px 12px;}.huruf-grid{grid-template-columns:repeat(auto-fill,minmax(68px,1fr));}}
</style>
</head>

(function(){
var IQRO = {
  1:{nama:'Iqro 1',icon:'🌱',desc:'Huruf Hijaiyah Dasar',halaman:[
    {id:'1-1',judul:'Alif & Ba',sub:'Huruf 1–2',intro:'Mengenal dua huruf pertama hijaiyah. Alif tidak berbunyi sendiri, Ba berbunyi "ba".',
     huruf:[{a:'أَ',l:'A'},{a:'بَ',l:'Ba'},{a:'أَ',l:'A'},{a:'بَ',l:'Ba'},{a:'أَ',l:'A'},{a:'بَ',l:'Ba'}],
     lat:[{a:'أَ بَ',l:'a - ba'},{a:'بَ أَ',l:'ba - a'},{a:'أَ بَ أَ',l:'a - ba - a'},{a:'بَ أَ بَ',l:'ba - a - ba'}]},

    {id:'6-8',judul:'Al-Kautsar',sub:'Surat ke-108 (3 Ayat)',intro:'Al-Kautsar adalah surat terpendek dalam Al-Qur\'an. Berisi nikmat Allah yang berlimpah.',
     huruf:[{a:'إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ',l:"Innaa a\'thaynakal kawtsar"},{a:'فَصَلِّ لِرَبِّكَ وَانْحَرْ',l:'Fasholli lirabbika wanhar'},{a:'إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ',l:"Inna syaani-aka huwal abtar"}],
     lat:[{a:'إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ',l:"Innaa a\'thaynakal kawtsar"},{a:'فَصَلِّ لِرَبِّكَ وَانْحَرْ',l:'Fasholli lirabbika wanhar'},{a:'إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ',l:"Inna syaani-aka huwal abtar"}]},

var curLevel=1,curHalIdx=0;
var hapal={};
try{hapal=JSON.parse(localStorage.getItem('iqro_hapal_v2')||'{}');}catch(e){}
var synth=window.speechSynthesis;

/* INIT */
var tabs=document.getElementById('levelTabs');
[1,2,3,4,5,6].forEach(function(l){
  var b=document.createElement('button');
  b.className='level-tab'+(l===1?' aktif':'');
  b.id='ltab-'+l;
  b.textContent='Iqro '+l;
  b.onclick=function(){setLevel(l);};
  tabs.appendChild(b);
});
setLevel(1);

function setLevel(l){
  curLevel=l;curHalIdx=0;
  [1,2,3,4,5,6].forEach(function(x){
    var t=document.getElementById('ltab-'+x);
    if(t)t.classList.toggle('aktif',x===l);
  });
  renderList();renderPage(0);
}

function renderList(){
  var el=document.getElementById('halamanList');
  var pages=IQRO[curLevel].halaman;
  var doneCount=pages.filter(function(h){return hapal[h.id];}).length;
  el.innerHTML='<div style="padding:6px 10px 2px;font-size:0.65rem;color:var(--text-light);font-weight:700;letter-spacing:0.08em;text-transform:uppercase;">'+
    IQRO[curLevel].desc+' · '+doneCount+'/'+pages.length+' selesai</div>'+
  pages.map(function(h,i){
    var done=hapal[h.id]?'✅':'';
    return '<button class="hal-item'+(i===curHalIdx?' aktif':'')+'" id="hi-'+h.id+'" onclick="gotoHal('+i+')">'+
      '<div class="hi-num">'+(i+1)+'</div>'+
      '<div class="hi-text"><div class="hi-title">'+h.judul+'</div><div class="hi-sub">'+h.sub+'</div></div>'+
      '<div class="hi-done">'+done+'</div>'+
      '</button>';
  }).join('');
}

window.gotoHal=function(idx){curHalIdx=idx;renderList();renderPage(idx);};

function renderPage(idx){
  var lv=IQRO[curLevel],hal=lv.halaman[idx],total=lv.halaman.length;
  var done=hapal[hal.id];
  var doneCount=lv.halaman.filter(function(h){return hapal[h.id];}).length;
  var pct=Math.round(doneCount/total*100);

  var html=
    '<div class="content-header">'+
      '<div class="ch-left"><h3>'+lv.icon+' '+lv.nama+' — '+hal.judul+'</h3>'+
      '<p>'+hal.sub+' · Hal. '+(idx+1)+'/'+total+' · '+lv.desc+'</p></div>'+
      '<div class="ch-progress">'+
        '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:'+pct+'%"></div></div>'+
        '<span class="progress-text">'+doneCount+'/'+total+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="huruf-area">'+
      '<div class="halaman-intro">'+
        '<div class="intro-icon">'+lv.icon+'</div>'+
        '<div class="intro-text"><h4>'+hal.judul+'</h4>'+
        '<p>'+hal.intro+' <em>🔊 Klik kartu untuk mendengar pengucapan.</em></p>'+
        '<span class="level-badge">'+lv.nama+' · Hal '+(idx+1)+'</span></div>'+
      '</div>'+
      '<div class="huruf-grid">';

  hal.huruf.forEach(function(h,i){
    html+=
      '<div class="huruf-card" id="hc-'+hal.id+'-'+i+'" onclick="bunyiHuruf('+JSON.stringify(h.a)+',\''+hal.id+'\','+i+')">'+
        '<div class="hc-arab">'+h.a+'</div>'+
        '<div class="hc-latin">'+h.l+'</div>'+
        '<div class="hc-speaker">🔊</div>'+
      '</div>';
  });

  html+='</div>';

  if(hal.lat&&hal.lat.length){
    html+='<div class="latihan-section"><div class="latihan-title">✏️ Latihan Baca</div><div class="latihan-grid">';
    hal.lat.forEach(function(lt){
      html+=
        '<div class="latihan-card" onclick="bunyiLatihan('+JSON.stringify(lt.a)+',this)">'+
          '<div class="lc-arab">'+lt.a+'</div>'+
          '<div class="lc-latin">'+lt.l+'</div>'+
        '</div>';
    });
    html+='</div></div>';
  }

  html+='</div>'+
    '<div class="bottom-nav">'+
      '<button class="nav-btn" onclick="gotoHal('+(idx-1)+')" '+(idx<=0?'disabled':'')+'>← Sebelumnya</button>'+
      '<button class="btn-selesai'+(done?' done':'')+'" onclick="tandaiSelesai(\''+hal.id+'\')">'+
        (done?'✅ Selesai':'✓ Tandai Selesai')+
      '</button>'+
      '<button class="nav-btn" onclick="gotoHal('+(idx+1)+')" '+(idx>=total-1?'disabled':'')+'>Berikutnya →</button>'+
    '</div>';

  document.getElementById('mainContent').innerHTML=html;
  var btn=document.getElementById('hi-'+hal.id);
  if(btn)btn.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function ucapkan(teks){
  if(!synth)return;
  synth.cancel();
  var u=new SpeechSynthesisUtterance(teks);
  u.lang='ar-SA';u.rate=0.65;u.pitch=1;
  synth.speak(u);
}

window.bunyiHuruf=function(arab,halId,idx){
  var c=document.getElementById('hc-'+halId+'-'+idx);
  if(c){c.classList.add('playing');setTimeout(function(){c.classList.remove('playing');},1200);}
  ucapkan(arab);
};

window.bunyiLatihan=function(arab,el){
  el.classList.add('playing');
  setTimeout(function(){el.classList.remove('playing');},1600);
  ucapkan(arab);
};

window.tandaiSelesai=function(halId){
  hapal[halId]=!hapal[halId];
  try{localStorage.setItem('iqro_hapal_v2',JSON.stringify(hapal));}catch(e){}
  renderList();renderPage(curHalIdx);
};

})();
</script>
</body>
</html>
