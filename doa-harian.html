<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doa Harian — Musholla Baiturrahman</title>
<link rel="icon" type="image/png" href="images/musholla.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green-deep:#0d3b2e;--green-mid:#155f45;--green-bright:#1e8a5e;--gold:#c9a84c;--gold-light:#e8c97a;--cream:#f9f5ee;--cream-dark:#ede8dc;--white:#ffffff;--text-dark:#1a1a1a;--text-mid:#4a4a4a;--text-light:#7a7a7a;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--text-dark);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(13,59,46,0.97);backdrop-filter:blur(12px);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;border-bottom:1px solid rgba(201,168,76,0.3);}
  .nav-brand{display:flex;align-items:center;gap:12px;text-decoration:none;}
  .nav-brand img{height:38px;width:auto;}
  .nav-brand span{font-size:0.85rem;font-weight:600;color:var(--white);}
  .nav-back{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,0.8);text-decoration:none;font-size:0.82rem;font-weight:500;padding:7px 14px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);transition:all 0.2s;}
  .nav-back:hover{background:rgba(255,255,255,0.1);color:var(--gold-light);}
  .main-layout{display:flex;height:calc(100vh - 64px);margin-top:64px;}

  /* Sidebar */
  .sidebar{width:290px;flex-shrink:0;background:var(--white);border-right:1px solid var(--cream-dark);display:flex;flex-direction:column;}
  .sidebar-header{padding:16px;background:linear-gradient(135deg,var(--green-deep),var(--green-mid));flex-shrink:0;}
  .sidebar-header h2{font-family:'Amiri',serif;font-size:1.2rem;color:var(--white);margin-bottom:4px;}
  .sidebar-header p{font-size:0.72rem;color:rgba(255,255,255,0.6);margin-bottom:10px;}
  .search-box{width:100%;padding:9px 14px;border:none;border-radius:8px;font-size:0.82rem;font-family:'Plus Jakarta Sans',sans-serif;outline:none;background:rgba(255,255,255,0.15);color:var(--white);}
  .search-box::placeholder{color:rgba(255,255,255,0.5);}
  .search-box:focus{background:rgba(255,255,255,0.25);}
  .doa-nav-list{flex:1;overflow-y:auto;padding:6px;}
  .doa-nav-list::-webkit-scrollbar{width:4px;}
  .doa-nav-list::-webkit-scrollbar-thumb{background:var(--cream-dark);border-radius:2px;}

  /* Kategori */
  .kategori-label{font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-light);padding:10px 10px 4px;display:flex;align-items:center;gap:6px;}
  .kategori-label::after{content:'';flex:1;height:1px;background:var(--cream-dark);}
  .doa-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;border:none;width:100%;text-align:left;background:transparent;transition:background 0.15s;}
  .doa-item:hover{background:rgba(30,138,94,0.08);}
  .doa-item.aktif{background:var(--green-deep);}
  .doa-item.aktif .di-icon,.doa-item.aktif .di-name{color:var(--white)!important;}
  .di-icon{font-size:1rem;flex-shrink:0;}
  .di-name{font-size:0.82rem;font-weight:500;color:var(--text-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* Stats bar */
  .stats-bar{padding:8px 16px;background:rgba(30,138,94,0.08);border-bottom:1px solid var(--cream-dark);font-size:0.72rem;color:var(--text-light);flex-shrink:0;}
  .stats-bar span{color:var(--green-bright);font-weight:700;}

  /* Content */
  .content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .content-header{padding:20px 28px;background:linear-gradient(135deg,var(--green-deep),var(--green-mid));flex-shrink:0;text-align:center;}
  .ch-badge{display:inline-block;background:rgba(201,168,76,0.2);color:var(--gold-light);font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:3px 12px;border-radius:20px;border:1px solid rgba(201,168,76,0.3);margin-bottom:8px;}
  .ch-title{font-family:'Amiri',serif;font-size:1.5rem;color:var(--white);}
  .content-body{flex:1;overflow-y:auto;padding:24px 28px;}
  .content-body::-webkit-scrollbar{width:5px;}
  .content-body::-webkit-scrollbar-thumb{background:var(--cream-dark);border-radius:3px;}
  .doa-arab-box{background:linear-gradient(135deg,var(--green-deep),var(--green-mid));border-radius:16px;padding:24px 28px;margin-bottom:20px;border-top:3px solid var(--gold);}
  .doa-arab-text{font-family:'Amiri',serif;font-size:1.6rem;line-height:2.2;color:var(--white);direction:rtl;text-align:right;}
  .section-label{font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--green-bright);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--cream-dark);}
  .latin-box{font-size:0.88rem;color:var(--green-mid);font-style:italic;line-height:1.9;padding:14px 18px;background:rgba(30,138,94,0.05);border-radius:8px;margin-bottom:16px;}
  .arti-box{font-size:0.88rem;color:var(--text-mid);line-height:1.9;padding:14px 18px;background:var(--white);border-left:3px solid var(--green-bright);border-radius:0 8px 8px 0;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.04);}
  .faedah-box{font-size:0.84rem;color:var(--text-mid);line-height:1.8;padding:14px 18px;background:rgba(201,168,76,0.07);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;margin-bottom:16px;}
  .sumber-box{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;font-size:0.72rem;font-weight:600;background:rgba(30,138,94,0.1);color:var(--green-mid);}
  .waktu-box{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;font-size:0.72rem;font-weight:600;background:rgba(201,168,76,0.12);color:#8a6b1e;margin-left:8px;}
  .nav-arrows{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--cream-dark);}
  .nav-btn{flex:1;padding:10px;border:1px solid var(--cream-dark);background:var(--white);border-radius:8px;font-size:0.8rem;font-weight:600;color:var(--text-mid);cursor:pointer;transition:all 0.2s;font-family:'Plus Jakarta Sans',sans-serif;}
  .nav-btn:hover{background:var(--green-deep);color:var(--white);border-color:var(--green-deep);}
  .nav-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px;}
  .placeholder-icon{font-size:3rem;opacity:0.35;}
  .placeholder h3{font-family:'Amiri',serif;font-size:1.4rem;color:var(--green-deep);}
  .placeholder p{font-size:0.85rem;color:var(--text-light);line-height:1.7;max-width:340px;}
  @media(max-width:768px){.sidebar{width:240px;}nav .nav-brand span{display:none;}.content-body{padding:16px;}}
  @media(max-width:520px){.main-layout{flex-direction:column;}.sidebar{width:100%;height:220px;border-right:none;border-bottom:1px solid var(--cream-dark);}.doa-nav-list{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;flex-direction:row;}.doa-item{min-width:120px;flex-direction:column;align-items:flex-start;gap:2px;}}
</style>
</head>

    {id:1,kat:'Pagi & Malam',icon:'🌅',nama:'Doa Bangun Tidur',arab:'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ',latin:'Alhamdulillahil ladzii ahyaanaa ba\'da maa amaatanaa wa ilayhin nusyuur.',arti:'Segala puji bagi Allah yang menghidupkan kami setelah mematikan kami, dan kepada-Nya lah kami kembali.',sumber:'HR. Bukhari No. 6324',waktu:'Setelah bangun tidur'},

    {id:7,kat:'Pagi & Malam',icon:'⚡',nama:'Doa Saat Angin Kencang',arab:'اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا وَخَيْرَ مَا فِيهَا وَخَيْرَ مَا أُرْسِلَتْ بِهِ، وَأَعُوذُ بِكَ مِنْ شَرِّهَا وَشَرِّ مَا فِيهَا وَشَرِّ مَا أُرْسِلَتْ بِهِ',latin:'Allahumma innii as-aluka khayrahaa wa khayra maa fiihaa wa khayra maa ursilat bih, wa a\'uudzubika min syarrihaa wa syarri maa fiihaa wa syarri maa ursilat bih.',arti:'Ya Allah, aku memohon kepada-Mu kebaikan angin ini, kebaikan yang ada di dalamnya, dan kebaikan dari apa yang angin ini diutus dengannya. Dan aku berlindung kepada-Mu dari keburukan angin ini, keburukan yang ada di dalamnya, dan keburukan dari apa yang angin ini diutus dengannya.',sumber:'HR. Muslim No. 899',waktu:'Saat angin kencang / badai'},

    {id:19,kat:'Aktivitas Sehari-hari',icon:'🚽',nama:'Doa Masuk Kamar Mandi',arab:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ',latin:'Allahumma innii a\'uudzubika minal khubutsi wal khabaa-its.',arti:'Ya Allah, sesungguhnya aku berlindung kepada-Mu dari setan laki-laki dan setan perempuan.',sumber:'HR. Bukhari No. 142',waktu:'Sebelum masuk kamar mandi'},
    {id:20,kat:'Aktivitas Sehari-hari',icon:'✅',nama:'Doa Keluar Kamar Mandi',arab:'غُفْرَانَكَ',latin:'Ghufraanaka.',arti:'(Aku memohon) ampunan-Mu (ya Allah).',sumber:'HR. Abu Dawud No. 30',waktu:'Setelah keluar kamar mandi'},
    {id:21,kat:'Aktivitas Sehari-hari',icon:'👗',nama:'Doa Memakai Pakaian',arab:'الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ',latin:'Alhamdulillahil ladzii kasaanii haadzaa wa razaqaniihi min ghayri hawlin minnii wa laa quwwah.',arti:'Segala puji bagi Allah yang telah memberikan pakaian ini kepadaku dan menganugerahkannya kepadaku tanpa daya dan kekuatan dariku.',sumber:'HR. Abu Dawud No. 4023',waktu:'Saat memakai pakaian baru'},
    {id:22,kat:'Aktivitas Sehari-hari',icon:'🪞',nama:'Doa Melihat Cermin',arab:'اللَّهُمَّ أَنْتَ حَسَّنْتَ خَلْقِي فَحَسِّنْ خُلُقِي',latin:'Allahumma anta hassanta khalqii fa hassin khuluqii.',arti:'Ya Allah, Engkau telah memperindah penciptaanku, maka perindahkanlah akhlakku.',sumber:'HR. Ahmad No. 3616',waktu:'Saat bercermin'},
    {id:23,kat:'Aktivitas Sehari-hari',icon:'😤',nama:'Doa Saat Marah',arab:'أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ',latin:'A\'uudzubillaahi minasy syaythaanir rajiim.',arti:'Aku berlindung kepada Allah dari setan yang terkutuk.',sumber:'HR. Bukhari No. 6115',waktu:'Saat merasa marah'},
    {id:24,kat:'Aktivitas Sehari-hari',icon:'💤',nama:'Doa Ketika Susah Tidur',arab:'اللَّهُمَّ غَارَتِ النُّجُومُ وَهَدَأَتِ الْعُيُونُ وَأَنْتَ حَيٌّ قَيُّومٌ لَا تَأْخُذُكَ سِنَةٌ وَلَا نَوْمٌ يَا حَيُّ يَا قَيُّومُ أَهْدِئْ لَيْلِي وَأَنِمْ عَيْنِي',latin:'Allahumma ghaaratinnujuumu wa hada-atil \'uyuunu wa anta hayyun qayyuumun laa ta\'khudzuka sinatun wa laa nawmun, yaa hayyu yaa qayyuum, ahdi\' laylii wa anim \'aynii.',arti:'Ya Allah, bintang-bintang telah meredup, dan mata-mata telah tenang, sementara Engkau Maha Hidup, Maha Berdiri Sendiri, tidak dikuasai oleh kantuk maupun tidur. Wahai Yang Maha Hidup, Maha Berdiri Sendiri, tenangkanlah malamku dan lelaplah mataku.',sumber:'HR. Ibnu Sunni',waktu:'Saat sulit tidur'},

    // ═══════════════ PERJALANAN & KENDARAAN ═══════════════
    {id:25,kat:'Perjalanan & Kendaraan',icon:'🚗',nama:'Doa Naik Kendaraan',arab:'بِسْمِ اللَّهِ، الْحَمْدُ لِلَّهِ، سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ',latin:'Bismillaah, alhamdulillaah, subhaanal ladzii sakhkhara lanaa haadzaa wa maa kunnaa lahu muqriniiin, wa innaa ilaa rabbinaa lamunqalibuun.',arti:'Dengan nama Allah, segala puji bagi Allah, Maha Suci (Allah) yang telah menundukkan kendaraan ini untuk kami, padahal kami sebelumnya tidak mampu menguasainya, dan sesungguhnya kami akan kembali kepada Rabb kami.',sumber:'HR. Muslim No. 1342',waktu:'Saat naik kendaraan'},
    {id:26,kat:'Perjalanan & Kendaraan',icon:'✈️',nama:'Doa Bepergian',arab:'اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى',latin:'Allahumma innaa nas-aluka fii safarinaa haadzal birra wat taqwaa, wa minal \'amali maa tardha.',arti:'Ya Allah, sesungguhnya kami memohon kepada-Mu dalam perjalanan ini kebaikan dan ketakwaan, serta dari amal perbuatan apa yang Engkau ridhai.',sumber:'HR. Muslim No. 1342',waktu:'Saat bepergian'},
    {id:27,kat:'Perjalanan & Kendaraan',icon:'🏠',nama:'Doa Kembali dari Perjalanan',arab:'آيِبُونَ تَائِبُونَ عَابِدُونَ لِرَبِّنَا حَامِدُونَ',latin:'Aayibuuna taaiibuuna \'aabiduuna lirabbinaa haamiduun.',arti:'Kami kembali, bertaubat, beribadah, dan memuji Rabb kami.',sumber:'HR. Muslim No. 1342',waktu:'Saat kembali dari perjalanan'},
    {id:28,kat:'Perjalanan & Kendaraan',icon:'🌊',nama:'Doa Naik Kapal / di Laut',arab:'بِسْمِ اللَّهِ مَجْرَاهَا وَمُرْسَاهَا إِنَّ رَبِّي لَغَفُورٌ رَحِيمٌ',latin:'Bismillaahi majraahaa wa mursaahaa inna rabbii laghafuurur rahiim.',arti:'Dengan nama Allah saat berlayar dan berlabuh. Sesungguhnya Tuhanku benar-benar Maha Pengampun lagi Maha Penyayang.',sumber:'QS. Hud: 41',waktu:'Saat naik kapal / perjalanan laut'},
    {id:29,kat:'Perjalanan & Kendaraan',icon:'🏨',nama:'Doa Singgah di Tempat',arab:'أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ',latin:'A\'uudzubikalimaatillaahit taammati min syarri maa khalaq.',arti:'Aku berlindung dengan kalimat-kalimat Allah yang sempurna dari kejahatan apa yang Dia ciptakan.',sumber:'HR. Muslim No. 2708',waktu:'Saat singgah di suatu tempat (safar)'},

    // ═══════════════ BERSUCI & SHALAT ═══════════════
    {id:30,kat:'Bersuci & Shalat',icon:'🚿',nama:'Doa Sebelum Wudhu',arab:'بِسْمِ اللَّهِ',latin:'Bismillaah.',arti:'Dengan nama Allah.',sumber:'HR. Abu Dawud No. 101',waktu:'Sebelum berwudhu'},
    {id:31,kat:'Bersuci & Shalat',icon:'💧',nama:'Doa Sesudah Wudhu',arab:'أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ',latin:'Asyhadu allaa ilaaha illallaahu wahdahu laa syariika lahu wa asyhadu anna muhammadan \'abduhu wa rasuuluh, allahummaj\'alnii minat tawwaabiina waj\'alnii minal mutatahhiriin.',arti:'Aku bersaksi bahwa tidak ada tuhan yang berhak disembah kecuali Allah semata, tidak ada sekutu bagi-Nya. Dan aku bersaksi bahwa Muhammad adalah hamba dan utusan-Nya. Ya Allah, jadikanlah aku termasuk orang-orang yang bertaubat dan jadikanlah aku termasuk orang-orang yang mensucikan diri.',sumber:'HR. Muslim No. 234',waktu:'Setelah berwudhu'},
    {id:32,kat:'Bersuci & Shalat',icon:'🕋',nama:'Doa Setelah Adzan',arab:'اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلاَةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ',latin:'Allahumma rabba haadzihi d-da\'watit taammati wash shalaatil qaaimah, aati muhammadanil wasiilata wal fadhiilata wab\'atshu maqaamam mahmuudanil ladzii wa\'adtah.',arti:'Ya Allah, Rabb seruan yang sempurna ini dan shalat yang akan ditegakkan, berikanlah kepada Muhammad al-wasilah (derajat di surga) dan keutamaan, serta bangkitkanlah dia pada kedudukan yang terpuji yang telah Engkau janjikan.',sumber:'HR. Bukhari No. 614',waktu:'Setelah mendengar adzan'},
    {id:33,kat:'Bersuci & Shalat',icon:'🤲',nama:'Doa Qunut (Subuh)',arab:'اللَّهُمَّ اهْدِنَا فِيمَنْ هَدَيْتَ، وَعَافِنَا فِيمَنْ عَافَيْتَ، وَتَوَلَّنَا فِيمَنْ تَوَلَّيْتَ، وَبَارِكْ لَنَا فِيمَا أَعْطَيْتَ، وَقِنَا شَرَّ مَا قَضَيْتَ',latin:'Allahummahdinaa fiiman hadayt, wa \'aafinaa fiiman \'aafayt, wa tawallana fiiman tawallayt, wa baarik lanaa fiimaa a\'thayt, wa qinaa syarra maa qadhayt.',arti:'Ya Allah, berilah kami petunjuk seperti orang-orang yang telah Engkau beri petunjuk. Berilah kami keselamatan seperti orang-orang yang telah Engkau selamatkan. Peliharalah kami seperti orang-orang yang telah Engkau pelihara. Berkahilah kami dalam apa yang telah Engkau berikan. Lindungi kami dari keburukan yang telah Engkau tentukan.',sumber:'HR. Abu Dawud No. 1425',waktu:'Qunut Sholat Subuh'},
    {id:34,kat:'Bersuci & Shalat',icon:'🙇',nama:'Doa Sujud',arab:'سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ اللَّهُمَّ اغْفِرْ لِي',latin:'Subhaaanaka allahumma rabbanaa wa bihamdika allahummaghfir lii.',arti:'Maha Suci Engkau, ya Allah, Rabb kami, dan dengan memuji-Mu ya Allah ampunilah aku.',sumber:'HR. Bukhari No. 817',waktu:'Saat sujud dalam shalat'},
    {id:35,kat:'Bersuci & Shalat',icon:'📿',nama:'Sayyidul Istighfar',arab:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',latin:'Allahumma anta rabbii laa ilaaha illaa ant, khalaqtanii wa ana \'abduk, wa ana \'alaa \'ahdika wa wa\'dika mastatha\'t, a\'uudzubika min syarri maa shana\'t, abuu-u laka bini\'matika \'alayya wa abuu-u bidzambii, faghfir lii fa-innahu laa yaghfirudz dzunuuba illaa ant.',arti:'Ya Allah, Engkau adalah Rabb-ku, tidak ada Tuhan yang berhak disembah kecuali Engkau. Engkau telah menciptakanku dan aku adalah hamba-Mu. Aku berada di atas perjanjian dan janji-Mu semampuku. Aku berlindung kepada-Mu dari kejelekan perbuatanku. Aku mengakui nikmat-Mu kepadaku dan aku mengakui dosaku. Maka ampunilah aku, sesungguhnya tidak ada yang mengampuni dosa-dosa kecuali Engkau.',sumber:'HR. Bukhari No. 6306',waktu:'Pagi & Sore (Sayyidul Istighfar)',faedah:'Barangsiapa mengucapkannya di pagi hari dengan penuh keyakinan lalu meninggal sebelum sore, maka ia termasuk penghuni surga. Begitu pula sebaliknya di sore hari. (HR. Bukhari No. 6306)'},
    {id:36,kat:'Bersuci & Shalat',icon:'🌟',nama:'Doa Setelah Shalat (Ayat Kursi)',arab:'اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ',latin:'Allaahu laa ilaaha illaa huwal hayyul qayyuum, laa ta\'khudzuhu sinatun wa laa nawm.',arti:'Allah, tidak ada tuhan selain Dia. Yang Maha Hidup lagi terus menerus mengurus (makhluk-Nya). Tidak mengantuk dan tidak tidur.',sumber:'QS. Al-Baqarah: 255',waktu:'Setelah shalat fardhu',faedah:'Barangsiapa membaca Ayat Kursi setiap selesai shalat fardhu, tidak ada yang menghalanginya masuk surga kecuali kematian. (HR. An-Nasa\'i, Ibnu Hibban)'},

    // ═══════════════ DOA DARI AL-QUR'AN ═══════════════
    {id:37,kat:'Doa dari Al-Qur\'an',icon:'📖',nama:'Doa Kebaikan Dunia Akhirat',arab:'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ',latin:'Rabbanaa aatinaa fid dunyaa hasanatan wa fil aakhirati hasanatan wa qinaa \'adzaabannaar.',arti:'Ya Rabb kami, berikanlah kami kebaikan di dunia dan kebaikan di akhirat, dan jagalah kami dari azab neraka.',sumber:'QS. Al-Baqarah: 201',waktu:'Kapan saja'},
    {id:38,kat:'Doa dari Al-Qur\'an',icon:'💪',nama:'Doa Mohon Keteguhan Hati',arab:'رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ',latin:'Rabbanaa laa tuzigh quluubanaa ba\'da idz hadaytanaa wa hab lanaa min ladunka rahmah, innaka antal wahhaab.',arti:'Ya Rabb kami, janganlah Engkau condongkan hati kami kepada kesesatan setelah Engkau memberi kami petunjuk, dan anugerahkanlah kepada kami rahmat dari sisi-Mu. Sesungguhnya Engkau Maha Pemberi.',sumber:'QS. Ali Imran: 8',waktu:'Kapan saja'},
    {id:39,kat:'Doa dari Al-Qur\'an',icon:'🌈',nama:'Doa Mohon Ampun dan Rahmat',arab:'رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ',latin:'Rabbanaa innanaa aamannaa faghfir lanaa dzunuubanaa wa qinaa \'adzaabannaar.',arti:'Ya Rabb kami, sungguh kami telah beriman, maka ampunilah dosa-dosa kami dan lindungilah kami dari azab neraka.',sumber:'QS. Ali Imran: 16',waktu:'Kapan saja'},
    {id:40,kat:'Doa dari Al-Qur\'an',icon:'🌱',nama:'Doa Nabi Ibrahim: Ketaatan',arab:'رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ',latin:'Rabbij\'alnii muqiimash shalaati wa min dzurriyyatii rabbanaa wa taqabbal du\'aa.',arti:'Ya Tuhanku, jadikanlah aku dan anak cucuku orang-orang yang tetap mendirikan shalat. Ya Tuhan kami, perkenankanlah doaku.',sumber:'QS. Ibrahim: 40',waktu:'Kapan saja'},
    {id:41,kat:'Doa dari Al-Qur\'an',icon:'🤲',nama:'Doa Nabi Ibrahim: Ampunan',arab:'رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ',latin:'Rabbanaaghfir lii wa li waalidayya wa lil mu\'miniina yawma yaquumul hisaab.',arti:'Ya Rabb kami, ampunilah aku dan kedua orang tuaku serta orang-orang yang beriman pada hari diadakannya perhitungan (hari kiamat).',sumber:'QS. Ibrahim: 41',waktu:'Kapan saja'},
    {id:42,kat:'Doa dari Al-Qur\'an',icon:'📚',nama:'Doa Mohon Ilmu',arab:'رَبِّ زِدْنِي عِلْمًا',latin:'Rabbi zidnii \'ilmaa.',arti:'Ya Tuhanku, tambahkanlah ilmu kepadaku.',sumber:'QS. Thaha: 114',waktu:'Sebelum belajar / mencari ilmu'},
    {id:43,kat:'Doa dari Al-Qur\'an',icon:'😌',nama:'Doa Nabi Musa: Lapang Dada',arab:'رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي يَفْقَهُوا قَوْلِي',latin:'Rabbi syrah lii shadrii wa yassir lii amrii wahlul \'uqdatan min lisaanii yafqahu qawlii.',arti:'Ya Tuhanku, lapangkanlah dadaku, mudahkanlah urusanku, dan lepaskanlah kekakuan dari lidahku, agar mereka memahami perkataanku.',sumber:'QS. Thaha: 25-28',waktu:'Saat berbicara di depan umum / mengajar'},
    {id:44,kat:'Doa dari Al-Qur\'an',icon:'🧎',nama:'Doa Nabi Ayyub: Melepas Kesusahan',arab:'أَنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ',latin:'Annii massaniyad dhurru wa anta arhamur raahimiin.',arti:'(Ya Allah), sesungguhnya aku telah ditimpa penyakit dan Engkau adalah Tuhan Yang Maha Penyayang di antara semua penyayang.',sumber:'QS. Al-Anbiya: 83',waktu:'Saat sakit atau kesusahan'},
    {id:45,kat:'Doa dari Al-Qur\'an',icon:'🌊',nama:'Doa Nabi Yunus: Dalam Kegelapan',arab:'لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ',latin:'Laa ilaaha illaa anta subhaanaka innii kuntu minazh zhaalimiin.',arti:'Tidak ada tuhan selain Engkau, Maha Suci Engkau. Sungguh, aku termasuk orang-orang yang zalim.',sumber:'QS. Al-Anbiya: 87',waktu:'Saat dalam kesulitan besar',faedah:'Tidaklah seorang Muslim berdoa dengannya untuk suatu perkara, melainkan Allah akan mengabulkannya. (HR. Tirmidzi No. 3505)'},
    {id:46,kat:'Doa dari Al-Qur\'an',icon:'🌺',nama:'Doa Mohon Keturunan Shalih',arab:'رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ',latin:'Rabbi hab lii minash shaalihiin.',arti:'Ya Tuhanku, anugerahkanlah kepadaku (seorang anak) yang termasuk orang-orang yang shalih.',sumber:'QS. As-Shaffat: 100',waktu:'Doa memohon anak shalih'},
    {id:47,kat:'Doa dari Al-Qur\'an',icon:'👨‍👩‍👧',nama:'Doa Memohon Keluarga Sakinah',arab:'رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا',latin:'Rabbanaa hab lanaa min azwaajinaa wa dzurriyyaatinaa qurrata a\'yunin waj\'alnaa lil muttaqiina imaama.',arti:'Ya Rabb kami, anugerahkanlah kepada kami pasangan kami dan keturunan kami sebagai penyenang hati (kami), dan jadikanlah kami pemimpin bagi orang-orang yang bertakwa.',sumber:'QS. Al-Furqan: 74',waktu:'Doa untuk keluarga'},
    {id:48,kat:'Doa dari Al-Qur\'an',icon:'🔑',nama:'Doa Serahkan Urusan kepada Allah',arab:'حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ',latin:'Hasbunallaahu wa ni\'mal wakiil.',arti:'Cukuplah Allah menjadi penolong kami dan Dia sebaik-baik pelindung.',sumber:'QS. Ali Imran: 173',waktu:'Saat merasa gundah / pasrah'},
    {id:49,kat:'Doa dari Al-Qur\'an',icon:'🕊️',nama:'Doa Mohon Petunjuk (Al-Fatihah)',arab:'اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ',latin:'Ihdinaash shiraathal mustaqiim, shiraathal ladziina an\'amta \'alayhim ghayril maghdhuubi \'alayhim wa laadh dhaalliiin.',arti:'Tunjukilah kami jalan yang lurus, (yaitu) jalan orang-orang yang telah Engkau beri nikmat kepadanya, bukan (jalan) mereka yang dimurkai dan bukan (pula jalan) mereka yang sesat.',sumber:'QS. Al-Fatihah: 6-7',waktu:'Setiap saat, dibaca dalam shalat'},

    // ═══════════════ KESEHATAN & KESELAMATAN ═══════════════
    {id:50,kat:'Kesehatan & Keselamatan',icon:'🤒',nama:'Doa Menjenguk Orang Sakit',arab:'اللَّهُمَّ رَبَّ النَّاسِ، أَذْهِبِ الْبَأْسَ، اشْفِ أَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا',latin:'Allahumma rabban naas, adz-hibil ba-sa, isyfi antasy syaafii, laa syifaa-a illaa syifaa-uka, syifaa-an laa yughaadiru saqamaa.',arti:'Ya Allah, Rabb manusia, hilangkanlah penyakit ini, sembuhkanlah, Engkaulah Maha Penyembuh, tidak ada kesembuhan kecuali kesembuhan dari-Mu, kesembuhan yang tidak meninggalkan penyakit.',sumber:'HR. Bukhari No. 5742',waktu:'Saat sakit atau menjenguk orang sakit'},
    {id:51,kat:'Kesehatan & Keselamatan',icon:'🤕',nama:'Doa Ruqyah Mandiri',arab:'أَعُوذُ بِعِزَّةِ اللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ',latin:'A\'uudzubi \'izzatillaahi wa qudratihii min syarri maa ajidu wa uhaadzir.',arti:'Aku berlindung dengan kemuliaan Allah dan kekuasaan-Nya dari kejahatan apa yang aku rasakan dan aku khawatirkan.',sumber:'HR. Muslim No. 2202',waktu:'Saat merasakan sakit di tubuh',faedah:'Nabi ﷺ mengajarkan agar meletakkan tangan di tempat yang sakit lalu membaca doa ini 7 kali.'},
    {id:52,kat:'Kesehatan & Keselamatan',icon:'🛡️',nama:'Doa Perlindungan Pagi',arab:'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ',latin:'Bismillaahil ladzii laa yadhurru ma\'asmihi syay-un fil ardhi wa laa fis samaa-i wa huwas samii\'ul \'aliim.',arti:'Dengan nama Allah yang bersama nama-Nya tidak ada sesuatu pun yang dapat membahayakan di bumi maupun di langit, dan Dia Maha Mendengar lagi Maha Mengetahui.',sumber:'HR. Abu Dawud No. 5088',waktu:'Pagi dan sore (3x) — perlindungan',faedah:'Barangsiapa membacanya 3x di pagi dan sore hari, tidak ada sesuatu pun yang membahayakannya. (HR. Abu Dawud, Tirmidzi)'},
    {id:53,kat:'Kesehatan & Keselamatan',icon:'😰',nama:'Doa Saat Gundah dan Sedih',arab:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ',latin:'Allahumma innii a\'uudzubika minal hammi wal hazan, wal \'ajzi wal kasal, wal bukhli wal jubn, wa dhala\'id dayni wa ghalabatir rijaal.',arti:'Ya Allah, aku berlindung kepada-Mu dari kesusahan dan kesedihan, dari kelemahan dan kemalasan, dari kekikiran dan sifat pengecut, dari lilitan hutang dan penguasaan orang lain.',sumber:'HR. Bukhari No. 6369',waktu:'Saat merasa gundah, sedih, atau tertekan'},
    {id:54,kat:'Kesehatan & Keselamatan',icon:'😟',nama:'Doa Menghilangkan Kekhawatiran',arab:'اللَّهُمَّ إِنِّي عَبْدُكَ وَابْنُ عَبْدِكَ وَابْنُ أَمَتِكَ، نَاصِيَتِي بِيَدِكَ، مَاضٍ فِيَّ حُكْمُكَ، عَدْلٌ فِيَّ قَضَاؤُكَ، أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ، سَمَّيْتَ بِهِ نَفْسَكَ أَوْ عَلَّمْتَهُ أَحَدًا مِنْ خَلْقِكَ أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ، أَوِ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الْغَيْبِ عِنْدَكَ، أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي وَنُورَ صَدْرِي وَجَلَاءَ حُزْنِي وَذَهَابَ هَمِّي',latin:'Allahumma innii \'abduka wabnu \'abdika wabnu amatik, naashiyatii biyadik, maadhin fiyya hukmuk, \'adlun fiyya qadhaa-uk, as-aluka bikulli ismin huwa lak, sammayta bihi nafsaka aw \'allamtahu ahadan min khalqika aw anzaltahu fii kitaabika aw ista-tsarta bihi fii \'ilmil ghaybi \'indak, an taj\'alal qur-aana rabii\'a qalbii wa nuura shadrii wa jalaa-a huznii wa dzahaaba hammii.',arti:'Ya Allah, sesungguhnya aku adalah hamba-Mu, anak dari hamba-Mu (laki-laki) dan anak dari hamba-Mu (perempuan). Ubun-ubunku ada di tangan-Mu, keputusan-Mu berlaku padaku, takdir-Mu adil bagiku. Aku memohon kepada-Mu dengan setiap nama yang menjadi milik-Mu... agar Engkau menjadikan Al-Qur\'an sebagai musim semi hatiku, cahaya dadaku, penyingkap kesedihanku, dan penghilang kegundahanku.',sumber:'HR. Ahmad No. 3712',waktu:'Saat dirundung kesedihan mendalam',faedah:'Barangsiapa berdoa dengan doa ini, Allah akan menghilangkan kesedihannya dan menggantikannya dengan kegembiraan. (HR. Ahmad)'},

    // ═══════════════ BELAJAR & PEKERJAAN ═══════════════
    {id:55,kat:'Belajar & Pekerjaan',icon:'🎓',nama:'Doa Sebelum Belajar',arab:'رَبِّ زِدْنِي عِلْمًا وَارْزُقْنِي فَهْمًا',latin:'Rabbi zidnii \'ilmaa warzuqnii fahmaa.',arti:'Ya Tuhanku, tambahkanlah ilmuku dan anugerahkanlah kepadaku pemahaman.',sumber:'QS. Thaha: 114 & Doa Ulama',waktu:'Sebelum belajar atau ujian'},
    {id:56,kat:'Belajar & Pekerjaan',icon:'📝',nama:'Doa Setelah Belajar',arab:'اللَّهُمَّ إِنِّي أَسْتَوْدِعُكَ مَا عَلَّمْتَنِي فَارْدُدْهُ إِلَيَّ عِنْدَ حَاجَتِي إِلَيْهِ وَلَا تُنْسِنِيهِ يَا رَبَّ الْعَالَمِينَ',latin:'Allahumma innii astawdi\'uka maa \'allamtanii faruddahu ilayya \'inda haajatii ilayhi wa laa tunsiihi yaa rabbal \'aalamiin.',arti:'Ya Allah, aku titipkan kepada-Mu ilmu yang telah Engkau ajarkan kepadaku, maka kembalikanlah kepadaku ketika aku membutuhkannya, dan janganlah Engkau buatku melupakannya, wahai Tuhan semesta alam.',sumber:'Doa Ulama Salaf',waktu:'Setelah belajar'},
    {id:57,kat:'Belajar & Pekerjaan',icon:'💼',nama:'Doa Memulai Pekerjaan',arab:'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَوْنَ وَالتَّوْفِيقَ',latin:'Allahumma innii as-alukal \'awna wat tawfiiq.',arti:'Ya Allah, sesungguhnya aku memohon kepada-Mu pertolongan dan taufik.',sumber:'Doa Umum',waktu:'Sebelum memulai pekerjaan'},
    {id:58,kat:'Belajar & Pekerjaan',icon:'💰',nama:'Doa Mohon Rezeki yang Baik',arab:'اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ',latin:'Allahummakfinii bihalaalika \'an haraamika wa aghninii bifadhlika \'amman siwaak.',arti:'Ya Allah, cukupkanlah aku dengan yang Engkau halalkan dari yang Engkau haramkan, dan cukupkanlah aku dengan karunia-Mu dari (bergantung kepada) selain-Mu.',sumber:'HR. Tirmidzi No. 3563',waktu:'Doa rezeki halal'},
    {id:59,kat:'Belajar & Pekerjaan',icon:'🏦',nama:'Doa Melunasi Hutang',arab:'اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ',latin:'Allahummakfinii bihalaalika \'an haraamika wa aghninii bifadhlika \'amman siwaak.',arti:'Ya Allah, cukupkanlah aku dengan yang halal dari-Mu sehingga tidak membutuhkan yang haram dari-Mu, dan cukupkanlah aku dengan karunia-Mu sehingga tidak membutuhkan selain-Mu.',sumber:'HR. Tirmidzi No. 3563',waktu:'Saat terjerat hutang'},

    // ═══════════════ KELUARGA & SOSIAL ═══════════════
    {id:60,kat:'Keluarga & Sosial',icon:'👶',nama:'Doa untuk Anak',arab:'أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ، مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ',latin:'U\'iidzukumaa bikalimaatillaahit taammati, min kulli syaythaanin wa haammah, wa min kulli \'aynin laammah.',arti:'Aku memohonkan perlindungan kepada kalian berdua dengan kalimat-kalimat Allah yang sempurna, dari setiap setan dan yang menggangu, dan dari setiap mata (\'ain) yang jahat.',sumber:'HR. Bukhari No. 3371',waktu:'Mendoakan anak'},
    {id:61,kat:'Keluarga & Sosial',icon:'💑',nama:'Doa Pengantin Baru',arab:'بَارَكَ اللَّهُ لَكَ وَبَارَكَ عَلَيْكَ وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ',latin:'Baarakallaahu laka wa baaraka \'alayka wa jama\'a baynakumaa fii khayr.',arti:'Semoga Allah memberkahimu, dan semoga Allah melimpahkan berkah kepadamu, dan semoga Allah mengumpulkan kalian berdua dalam kebaikan.',sumber:'HR. Abu Dawud No. 2130',waktu:'Ucapan untuk pengantin baru'},
    {id:62,kat:'Keluarga & Sosial',icon:'👫',nama:'Doa Suami-Istri Sebelum Berhubungan',arab:'بِسْمِ اللَّهِ، اللَّهُمَّ جَنِّبْنَا الشَّيْطَانَ وَجَنِّبِ الشَّيْطَانَ مَا رَزَقْتَنَا',latin:'Bismillaah, allahumma jannibnaasy syaithaana wa jannibisy syaithaana maa razaqtanaa.',arti:'Dengan nama Allah. Ya Allah, jauhkanlah kami dari setan dan jauhkanlah setan dari apa yang Engkau rezekikan kepada kami.',sumber:'HR. Bukhari No. 141',waktu:'Sebelum berhubungan suami-istri'},
    {id:63,kat:'Keluarga & Sosial',icon:'😇',nama:'Doa Bertemu Saudara',arab:'يُحِبُّكَ الَّذِي أَحْبَبْتَنِي فِيهِ',latin:'Yuhibbukal ladzii ahbabtanii fiihi.',arti:'Semoga Allah (yang membuatmu mencintaiku karena-Nya) mencintaimu.',sumber:'HR. Abu Dawud No. 5125',waktu:'Jawaban ketika seseorang menyatakan cinta karena Allah'},
    {id:64,kat:'Keluarga & Sosial',icon:'🎂',nama:'Doa Saat Diberi Selamat',arab:'بَارَكَ اللَّهُ لَكَ',latin:'Baarakallaahu laka.',arti:'Semoga Allah memberkahimu.',sumber:'HR. Bukhari No. 5155',waktu:'Menjawab ucapan selamat'},
    {id:65,kat:'Keluarga & Sosial',icon:'🤧',nama:'Doa Ketika Bersin',arab:'الْحَمْدُ لِلَّهِ',latin:'Alhamdulillah.',arti:'Segala puji bagi Allah.',sumber:'HR. Bukhari No. 6224',waktu:'Saat bersin'},
    {id:66,kat:'Keluarga & Sosial',icon:'🗣️',nama:'Jawaban Doa Bersin',arab:'يَرْحَمُكَ اللَّهُ',latin:'Yarhamukallaah.',arti:'Semoga Allah merahmatimu.',sumber:'HR. Bukhari No. 6224',waktu:'Menjawab orang yang bersin'},
    {id:67,kat:'Keluarga & Sosial',icon:'😊',nama:'Balasan Doa Setelah Bersin',arab:'يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ',latin:'Yahdikumullaahu wa yushlihu baalakum.',arti:'Semoga Allah memberi kalian petunjuk dan memperbaiki keadaan kalian.',sumber:'HR. Bukhari No. 6224',waktu:'Balasan setelah bersin'},
    {id:68,kat:'Keluarga & Sosial',icon:'🍼',nama:'Doa Menyambut Bayi Lahir',arab:'اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ',latin:'Allaahu akbar, allaahu akbar, asyhadu allaa ilaaha illallaah.',arti:'Allah Maha Besar, Allah Maha Besar, Aku bersaksi tidak ada tuhan selain Allah.',sumber:'HR. Abu Dawud No. 5105',waktu:'Azan di telinga kanan bayi yang baru lahir'},

    // ═══════════════ MUSIBAH & COBAAN ═══════════════
    {id:69,kat:'Musibah & Cobaan',icon:'😔',nama:'Doa Saat Tertimpa Musibah',arab:'إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي وَأَخْلِفْ لِي خَيْرًا مِنْهَا',latin:'Innaa lillaahi wa innaa ilayhi raaji\'uun, allahumma-jurnii fii mushiibatii wa akhlif lii khayran minhaa.',arti:'Sesungguhnya kami milik Allah dan sesungguhnya kami akan kembali kepada-Nya. Ya Allah, berikanlah pahala kepadaku dalam musibahku ini dan gantikanlah untukku dengan yang lebih baik darinya.',sumber:'HR. Muslim No. 918',waktu:'Saat tertimpa musibah atau kehilangan'},
    {id:70,kat:'Musibah & Cobaan',icon:'🏥',nama:'Doa Takziah (Wafat)',arab:'إِنَّ لِلَّهِ مَا أَخَذَ وَلَهُ مَا أَعْطَى، وَكُلُّ شَيْءٍ عِنْدَهُ بِأَجَلٍ مُسَمًّى',latin:'Inna lillaahi maa akhadza wa lahu maa a\'thaa wa kullu syay-in \'indahu bi-ajalim musammaa.',arti:'Sesungguhnya milik Allah apa yang Dia ambil dan milik-Nya pula apa yang Dia berikan. Segala sesuatu di sisi-Nya ada batas waktu yang ditentukan.',sumber:'HR. Bukhari No. 1284',waktu:'Ucapan takziah kepada keluarga yang berduka'},
    {id:71,kat:'Musibah & Cobaan',icon:'🕊️',nama:'Doa untuk Orang yang Meninggal',arab:'اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ وَأَكْرِمْ نُزُلَهُ وَوَسِّعْ مُدْخَلَهُ',latin:'Allahummaghfir lahu warhamhu wa \'aafihii wa\'fu \'anhu wa akriim nuzulahu wa wassi\' mudkhalah.',arti:'Ya Allah, ampunilah dia, rahmatilah dia, sehatkanlah dia, maafkanlah dia, muliakanlah tempatnya, dan lapangkanlah tempat masuknya.',sumber:'HR. Muslim No. 963',waktu:'Mendoakan orang yang baru wafat'},
    {id:72,kat:'Musibah & Cobaan',icon:'💸',nama:'Doa Saat Kehilangan Harta',arab:'اللَّهُمَّ آجِرْنِي فِي مُصِيبَتِي وَاخْلُفْ لِي خَيْرًا مِنْهَا',latin:'Allahumma ajurnii fii mushiibatii wakhluf lii khayran minhaa.',arti:'Ya Allah, berilah aku pahala dalam musibah yang menimpaku ini dan gantikanlah untukku yang lebih baik darinya.',sumber:'HR. Muslim No. 918',waktu:'Saat kehilangan harta / sesuatu yang berharga'},
    {id:73,kat:'Musibah & Cobaan',icon:'😱',nama:'Doa Saat Ketakutan',arab:'لَا إِلَهَ إِلَّا اللَّهُ',latin:'Laa ilaaha illallaah.',arti:'Tidak ada tuhan yang berhak disembah selain Allah.',sumber:'HR. Bukhari No. 3346',waktu:'Saat merasa takut'},
    {id:74,kat:'Musibah & Cobaan',icon:'🙏',nama:'Doa Tawakkal',arab:'حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ',latin:'Hasbiyallaahu laa ilaaha illaa huwa \'alayhi tawakkaltu wa huwa rabbul \'arsyil \'azhiim.',arti:'Cukuplah Allah bagiku, tidak ada tuhan selain Dia, kepada-Nya aku bertawakkal, dan Dia adalah Rabb Arsy yang agung.',sumber:'HR. Abu Dawud No. 5081',waktu:'Saat merasa was-was atau ketakutan (7x pagi-sore)'},

    // ═══════════════ IBADAH KHUSUS ═══════════════
    {id:75,kat:'Ibadah Khusus',icon:'🌙',nama:'Doa Malam Lailatul Qadar',arab:'اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي',latin:'Allahumma innaka \'afuwwun tuhibbul \'afwa fa\'fu \'annii.',arti:'Ya Allah, sesungguhnya Engkau Maha Pemaaf, Engkau menyukai maaf, maka maafkanlah aku.',sumber:'HR. Tirmidzi No. 3513',waktu:'Malam Lailatul Qadar (10 malam terakhir Ramadhan)',faedah:'Aisyah RA bertanya kepada Nabi ﷺ: "Jika aku mendapati Lailatul Qadar, apa yang harus aku ucapkan?" Nabi ﷺ menjawab dengan doa ini. (HR. Tirmidzi No. 3513)'},
    {id:76,kat:'Ibadah Khusus',icon:'🌙',nama:'Doa Menyambut Ramadhan',arab:'اللَّهُمَّ بَارِكْ لَنَا فِي رَجَبٍ وَشَعْبَانَ وَبَلِّغْنَا رَمَضَانَ',latin:'Allahumma baarik lanaa fii rajabin wa sya\'baana wa ballighnaa ramadhaan.',arti:'Ya Allah, berkahilah kami di bulan Rajab dan Sya\'ban, dan sampaikanlah kami ke bulan Ramadhan.',sumber:'HR. Ahmad No. 2346',waktu:'Di bulan Rajab dan Sya\'ban'},
    {id:77,kat:'Ibadah Khusus',icon:'🌙',nama:'Doa Berbuka Puasa',arab:'اللَّهُمَّ لَكَ صُمْتُ وَبِكَ آمَنْتُ وَعَلَى رِزْقِكَ أَفْطَرْتُ',latin:'Allahumma laka shumtu wa bika aamantu wa \'alaa rizqika afthartu.',arti:'Ya Allah, karena-Mu aku berpuasa, kepada-Mu aku beriman, dan dengan rezeki-Mu aku berbuka.',sumber:'HR. Abu Dawud No. 2358',waktu:'Saat berbuka puasa'},
    {id:78,kat:'Ibadah Khusus',icon:'✈️',nama:'Doa Ihram (Haji/Umrah)',arab:'لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ لَا شَرِيكَ لَكَ',latin:'Labbayk allahumma labbayk, labbayk laa syariika laka labbayk, innal hamda wan ni\'mata laka wal mulka laa syariika lak.',arti:'Aku penuhi panggilan-Mu ya Allah, aku penuhi panggilan-Mu. Aku penuhi panggilan-Mu, tiada sekutu bagi-Mu, aku penuhi panggilan-Mu. Sesungguhnya segala puji dan nikmat hanya milik-Mu, dan kerajaan (juga milik-Mu), tiada sekutu bagi-Mu.',sumber:'HR. Bukhari No. 1549',waktu:'Talbiyah saat Haji dan Umrah'},
    {id:79,kat:'Ibadah Khusus',icon:'💰',nama:'Doa Membayar Zakat / Sedekah',arab:'اللَّهُمَّ اجْعَلْهَا مَغْنَمًا وَلَا تَجْعَلْهَا مَغْرَمًا',latin:'Allahumma-j\'alhaa maghnaman wa laa taj\'alhaa maghramaa.',arti:'Ya Allah, jadikanlah ini sebagai keuntungan dan janganlah jadikan ini sebagai kerugian.',sumber:'HR. Ibnu Majah No. 1797',waktu:'Saat membayar zakat'},
    {id:80,kat:'Ibadah Khusus',icon:'🐑',nama:'Doa Menyembelih Hewan Qurban',arab:'بِسْمِ اللَّهِ، اللَّهُ أَكْبَرُ، اللَّهُمَّ هَذَا مِنْكَ وَلَكَ',latin:'Bismillaah, allaahu akbar, allahumma haadzaa minka wa lak.',arti:'Dengan nama Allah, Allah Maha Besar. Ya Allah, ini dari-Mu dan untuk-Mu.',sumber:'HR. Abu Dawud No. 2795',waktu:'Saat menyembelih hewan qurban'},
    {id:81,kat:'Ibadah Khusus',icon:'📿',nama:'Wirid Tasbih (Subhanallah)',arab:'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ',latin:'Subhaanallaahi wa bihamdihii, subhaanallaahil \'azhiim.',arti:'Maha Suci Allah dan dengan memuji-Nya. Maha Suci Allah Yang Maha Agung.',sumber:'HR. Bukhari No. 6682',waktu:'Wirid harian setelah shalat',faedah:'Dua kalimat yang ringan di lisan, berat di timbangan, dan dicintai oleh Ar-Rahman. (HR. Bukhari No. 6682)'},
    {id:82,kat:'Ibadah Khusus',icon:'🙌',nama:'Doa Sesudah Shalat Tahajud',arab:'اللَّهُمَّ لَكَ الْحَمْدُ أَنْتَ قَيِّمُ السَّمَوَاتِ وَالْأَرْضِ وَمَنْ فِيهِنَّ، وَلَكَ الْحَمْدُ أَنْتَ نُورُ السَّمَوَاتِ وَالْأَرْضِ وَمَنْ فِيهِنَّ',latin:'Allahumma lakal hamdu anta qayyimus samaawaati wal ardhi wa man fiihin, wa lakal hamdu anta nuurus samaawaati wal ardhi wa man fiihin.',arti:'Ya Allah, bagi-Mu segala puji. Engkaulah yang mengurus langit, bumi, dan semua yang ada di dalamnya. Bagi-Mu segala puji. Engkau Cahaya langit, bumi, dan semua yang ada di dalamnya.',sumber:'HR. Bukhari No. 1120',waktu:'Setelah shalat Tahajud'},

    // ═══════════════ DOA LAIN-LAIN ═══════════════
    {id:83,kat:'Doa Lain-lain',icon:'🌺',nama:'Doa Masuk Pasar',arab:'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِي وَيُمِيتُ وَهُوَ حَيٌّ لَا يَمُوتُ، بِيَدِهِ الْخَيْرُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',latin:'Laa ilaaha illallaahu wahdahu laa syariika lahu, lahul mulku wa lahul hamdu yuhyii wa yumiitu wa huwa hayyun laa yamuutu, biyadihil khayru wa huwa \'alaa kulli syay-in qadiir.',arti:'Tidak ada tuhan yang berhak disembah kecuali Allah semata, tidak ada sekutu bagi-Nya. Bagi-Nya kerajaan dan bagi-Nya segala puji, Dia menghidupkan dan mematikan, dan Dia Maha Hidup tidak akan mati, di tangan-Nya segala kebaikan dan Dia Maha Kuasa atas segala sesuatu.',sumber:'HR. Tirmidzi No. 3428',waktu:'Saat masuk pasar / pusat perbelanjaan',faedah:'Barangsiapa masuk pasar lalu membaca doa ini, Allah akan mencatat untuknya sejuta kebaikan, menghapus darinya sejuta keburukan, dan meninggikan derajatnya sejuta tingkat. (HR. Tirmidzi No. 3428)'},
    {id:84,kat:'Doa Lain-lain',icon:'🌾',nama:'Doa Menanam / Berkebun',arab:'أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ',latin:'A\'uudzubikalimaatillaahit taammati min syarri maa khalaq.',arti:'Aku berlindung dengan kalimat-kalimat Allah yang sempurna dari kejahatan apa yang Dia ciptakan.',sumber:'HR. Muslim No. 2708',waktu:'Saat berkebun / berada di alam terbuka'},
    {id:85,kat:'Doa Lain-lain',icon:'🌙',nama:'Kaffaratul Majlis',arab:'سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ',latin:'Subhaanakallaahumma wa bihamdika, asyhadu allaa ilaaha illaa anta, astaghfiruka wa atuubu ilayk.',arti:'Maha Suci Engkau ya Allah dan dengan memuji-Mu, aku bersaksi bahwa tidak ada tuhan selain Engkau, aku memohon ampun kepada-Mu dan bertobat kepada-Mu.',sumber:'HR. Abu Dawud No. 4857',waktu:'Saat mengakhiri pertemuan / majelis',faedah:'Barangsiapa duduk dalam suatu majelis lalu sebelum berdiri membaca doa ini, akan diampuni baginya dosa yang terjadi dalam majelis tersebut. (HR. Tirmidzi No. 3433)'},
    {id:86,kat:'Doa Lain-lain',icon:'🌿',nama:'Doa Makan Sahur',arab:'اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ',latin:'Allahumma baarik lanaa fiimaa razaqtanaa wa qinaa \'adzaabannaar.',arti:'Ya Allah, berkahilah kami pada rezeki yang telah Engkau anugerahkan kepada kami, dan lindungilah kami dari azab neraka.',sumber:'Doa Umum',waktu:'Saat makan sahur'},
    {id:87,kat:'Doa Lain-lain',icon:'📱',nama:'Doa Memulai Aktivitas Penting',arab:'بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ',latin:'Bismillaah, tawakkaltu \'alallaah.',arti:'Dengan nama Allah, aku bertawakkal kepada Allah.',sumber:'Doa Umum',waktu:'Sebelum memulai aktivitas penting'},
    {id:88,kat:'Doa Lain-lain',icon:'🌟',nama:'Doa Penutup / Mengakhiri Hari',arab:'بِسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا',latin:'Bismikallaahumma amuutu wa ahyaa.',arti:'Dengan nama-Mu ya Allah, aku mati dan hidup.',sumber:'HR. Bukhari No. 6312',waktu:'Sebelum tidur untuk mengakhiri hari'},
    {id:89,kat:'Doa Lain-lain',icon:'🙏',nama:'Doa Mohon Husnul Khatimah',arab:'اللَّهُمَّ اخْتِمْ لَنَا بِالإِسْلاَمِ وَاخْتِمْ لَنَا بِالإِيمَانِ',latin:'Allahumma-khtim lanaa bil islaami wakhtim lanaa bil iimaan.',arti:'Ya Allah, akhirilah hidup kami dengan Islam dan akhirilah hidup kami dengan iman.',sumber:'Doa Ulama Salaf',waktu:'Kapan saja, terutama di akhir hari'},

    // ═══════════════ ISTIGHFAR ═══════════════
    {id:90,kat:'Istighfar',icon:'🌿',nama:'Istighfar Ringkas',arab:'أَسْتَغْفِرُ اللَّهَ',latin:'Astaghfirullaah.',arti:'Aku memohon ampunan kepada Allah.',sumber:'HR. Bukhari No. 6307',waktu:'Kapan saja, minimal 100x sehari',faedah:'Nabi ﷺ bersabda: "Demi Allah, sesungguhnya aku beristighfar kepada Allah dan bertobat kepada-Nya dalam sehari lebih dari tujuh puluh kali." (HR. Bukhari No. 6307)'},
    {id:91,kat:'Istighfar',icon:'🌿',nama:'Istighfar Lengkap',arab:'أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ',latin:'Astaghfirullaahal \'azhiiimal ladzii laa ilaaha illaa huwal hayyul qayyumu wa atuubu ilaih.',arti:'Aku memohon ampunan kepada Allah Yang Maha Agung, yang tidak ada tuhan selain Dia, yang Maha Hidup lagi Maha Berdiri Sendiri, dan aku bertobat kepada-Nya.',sumber:'HR. Tirmidzi No. 3577',waktu:'Kapan saja',faedah:'Barangsiapa membaca istighfar ini, Allah akan mengampuni dosanya meskipun ia lari dari medan perang. (HR. Tirmidzi No. 3577)'},
    {id:92,kat:'Istighfar',icon:'🌿',nama:'Sayyidul Istighfar (Penghulu Istighfar)',arab:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',latin:'Allahumma anta rabbii laa ilaaha illaa ant, khalaqtanii wa ana \'abduk, wa ana \'alaa \'ahdika wa wa\'dika mastatha\'t, a\'uudzubika min syarri maa shana\'t, abuu-u laka bini\'matika \'alayya wa abuu-u bidzambii, faghfir lii fa innahu laa yaghfirudz dzunuuba illaa ant.',arti:'Ya Allah, Engkau adalah Rabb-ku, tidak ada Tuhan yang berhak disembah selain Engkau. Engkau telah menciptakanku dan aku adalah hamba-Mu. Aku berada di atas perjanjian dan janji-Mu semampuku. Aku berlindung kepada-Mu dari keburukan apa yang aku lakukan. Aku mengakui nikmat-Mu kepadaku, dan aku mengakui dosaku, maka ampunilah aku. Sesungguhnya tidak ada yang mengampuni dosa-dosa kecuali Engkau.',sumber:'HR. Bukhari No. 6306',waktu:'Pagi (setelah Subuh) dan Sore (setelah Ashar)',faedah:'Barangsiapa mengucapkannya di pagi hari dengan penuh keyakinan, lalu ia meninggal di hari itu sebelum sore, maka ia termasuk penghuni surga. Dan barangsiapa mengucapkannya di sore hari dengan penuh keyakinan, lalu ia meninggal malam itu sebelum pagi, maka ia termasuk penghuni surga. (HR. Bukhari No. 6306)'},
    {id:93,kat:'Istighfar',icon:'🌿',nama:'Istighfar Nabi Adam AS',arab:'رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ',latin:'Rabbanaa zhalamnaaa anfusanaa wa in lam taghfir lanaa wa tarhamnaa lanakuunanna minal khaasiriin.',arti:'Ya Tuhan kami, kami telah menzalimi diri kami sendiri. Jika Engkau tidak mengampuni kami dan merahmati kami, niscaya kami termasuk orang-orang yang merugi.',sumber:'QS. Al-A\'raf: 23',waktu:'Saat bertaubat dari dosa',faedah:'Doa yang dipanjatkan Nabi Adam dan Hawa AS saat mereka memohon ampun kepada Allah atas kesalahan yang mereka lakukan.'},
    {id:94,kat:'Istighfar',icon:'🌿',nama:'Istighfar Nabi Musa AS',arab:'رَبِّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي',latin:'Rabbi innii zhalamtu nafsii faghfir lii.',arti:'Ya Tuhanku, sesungguhnya aku telah menzalimi diriku sendiri, maka ampunilah aku.',sumber:'QS. Al-Qashash: 16',waktu:'Saat bertaubat, merasa bersalah',faedah:'Doa Nabi Musa AS yang ringkas namun penuh penghayatan. Beliau langsung mengakui kesalahan dan memohon ampunan tanpa basa-basi.'},
    {id:95,kat:'Istighfar',icon:'🌿',nama:'Istighfar Nabi Yunus AS (Dzun Nun)',arab:'لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ',latin:'Laa ilaaha illaa anta subhaanaka innii kuntu minazh zhaalimiin.',arti:'Tidak ada tuhan selain Engkau. Maha Suci Engkau. Sesungguhnya aku termasuk orang-orang yang zalim.',sumber:'QS. Al-Anbiya: 87',waktu:'Saat berada dalam kesulitan dan memohon ampun',faedah:'Tidaklah seorang Muslim berdoa dengannya untuk suatu perkara, melainkan Allah akan mengabulkannya. (HR. Tirmidzi No. 3505)'},
    {id:96,kat:'Istighfar',icon:'🌿',nama:'Istighfar Nabi Nuh AS',arab:'رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِمَنْ دَخَلَ بَيْتِيَ مُؤْمِنًا وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ',latin:'Rabbighfir lii wa liwaalidayya wa liman dakhala baytii mu\'minan wa lil mu\'miniina wal mu\'minaat.',arti:'Ya Tuhanku, ampunilah aku, ibu bapakku, dan orang yang masuk ke rumahku dalam keadaan beriman, serta semua orang yang beriman laki-laki dan perempuan.',sumber:'QS. Nuh: 28',waktu:'Mendoakan diri, orang tua, dan seluruh kaum mukminin'},
    {id:97,kat:'Istighfar',icon:'🌿',nama:'Istighfar Nabi Ibrahim AS',arab:'رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ',latin:'Rabbanaaghfir lii wa liwaalidayya wa lil mu\'miniina yawma yaquumul hisaab.',arti:'Ya Rabb kami, ampunilah aku, kedua orang tuaku, dan orang-orang yang beriman pada hari ketika perhitungan (amal) dilaksanakan.',sumber:'QS. Ibrahim: 41',waktu:'Kapan saja, terutama mendoakan orang tua'},
    {id:98,kat:'Istighfar',icon:'🌿',nama:'Istighfar Memohon Ampun Dosa Besar',arab:'أَسْتَغْفِرُ اللَّهَ لِذَنْبِي وَأَتُوبُ إِلَيْهِ',latin:'Astaghfirullaaha lidzambii wa atuubu ilayh.',arti:'Aku memohon ampunan kepada Allah atas dosaku dan aku bertobat kepada-Nya.',sumber:'HR. Bukhari No. 834',waktu:'Saat menyesali dosa'},
    {id:99,kat:'Istighfar',icon:'🌿',nama:'Istighfar Penghapus Dosa di Majelis',arab:'سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ',latin:'Subhaanakallaahumma wa bihamdika, asyhadu allaa ilaaha illaa anta, astaghfiruka wa atuubu ilayk.',arti:'Maha Suci Engkau ya Allah dan dengan memuji-Mu, aku bersaksi bahwa tidak ada tuhan selain Engkau, aku memohon ampun kepada-Mu dan bertobat kepada-Mu.',sumber:'HR. Abu Dawud No. 4857',waktu:'Akhir setiap majelis / pertemuan (Kaffaratul Majlis)',faedah:'Barangsiapa duduk dalam suatu majelis dan banyak terjadi kegaduhan di dalamnya, lalu sebelum berdiri ia membaca doa ini, maka akan diampuni baginya dosa yang terjadi dalam majelis tersebut. (HR. Tirmidzi No. 3433)'},
    {id:100,kat:'Istighfar',icon:'🌿',nama:'Istighfar Mohon Ampun Segala Dosa',arab:'اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ',latin:'Allahummaghfir lii dzambii kullahu, diqqahu wa jillahu, wa awwalahu wa aakhirahu, wa \'alaaniyatahu wa sirrahu.',arti:'Ya Allah, ampunilah aku dari semua dosaku, yang kecil maupun yang besar, yang pertama maupun yang terakhir, yang tampak maupun yang tersembunyi.',sumber:'HR. Muslim No. 483',waktu:'Saat sujud dalam shalat atau kapan saja',faedah:'Doa ini diajarkan Nabi ﷺ agar kita memohon ampunan secara menyeluruh — tidak meninggalkan satu pun jenis dosa.'},
    {id:101,kat:'Istighfar',icon:'🌿',nama:'Istighfar & Taubat Nasuha',arab:'أَسْتَغْفِرُ اللَّهَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ تَوْبَةَ عَبْدٍ ظَالِمٍ لَا يَمْلِكُ لِنَفْسِهِ ضَرًّا وَلَا نَفْعًا وَلَا مَوْتًا وَلَا حَيَاةً وَلَا نُشُورًا',latin:'Astaghfirullaahal ladzii laa ilaaha illaa huwal hayyul qayyuumu wa atuubu ilayhi tawbata \'abdin zhaalimin laa yamliku linafsihii dharran wa laa naf\'an wa laa mawtan wa laa hayaatan wa laa nusyuuraa.',arti:'Aku memohon ampun kepada Allah yang tidak ada tuhan selain Dia, Yang Maha Hidup lagi Maha Berdiri Sendiri, dan aku bertobat kepada-Nya, tobatnya seorang hamba yang zalim yang tidak memiliki untuk dirinya sendiri mudarat, manfaat, kematian, kehidupan, maupun kebangkitan.',sumber:'Doa Taubat Ulama Salaf',waktu:'Saat bertaubat dengan sungguh-sungguh (Taubat Nasuha)'},
    {id:102,kat:'Istighfar',icon:'🌿',nama:'Istighfar Anak untuk Orang Tua',arab:'اللَّهُمَّ اغْفِرْ لِي وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا',latin:'Allahummaghfir lii wa liwaalidayya warhamhumaa kamaa rabbayaanii shaghiiraa.',arti:'Ya Allah, ampunilah aku dan kedua orang tuaku, serta rahmatilah keduanya sebagaimana mereka mendidikku sewaktu kecil.',sumber:'QS. Al-Isra: 24 & Doa Ulama',waktu:'Setiap saat, terutama setelah shalat fardhu'},

    // ═══════════════ AQIDATUL AWAM ═══════════════
    {id:103,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 1 — Muqaddimah (Pembukaan)',arab:'أَبْدَأُ بِاسْمِ اللَّهِ وَالرَّحْمَنِ ۞ وَبِالرَّحِيمِ دَائِمِ الإِحْسَانِ',latin:'Abda-u bismillaahi war-rahmaani ۞ wa bir-rahiimi daa-imil ihsaani.',arti:'Aku memulai dengan nama Allah, Ar-Rahman (Yang Maha Pengasih) ۞ dan Ar-Rahim (Yang Maha Penyayang) yang terus-menerus melimpahkan kebaikan.',sumber:'Aqidatul Awam — Syaikh Ahmad al-Marzuqi',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Aqidatul Awam adalah nazham (syair) aqidah karangan Syaikh Ahmad bin Muhammad al-Marzuqi al-Maliki (w. 1281 H). Beliau merangkum pokok-pokok aqidah Ahlussunnah wal Jamaah dalam 57 bait syair yang mudah dihafal, terutama bagi para pemula.'},
    {id:104,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 2 — Pujian kepada Allah',arab:'وَالحَمْدُ لِلَّهِ القَدِيمِ الأَوَّلِ ۞ وَالآخِرِ البَاقِي بِلاَ تَحَوُّلِ',latin:'Wal hamdu lillaahil qadiimil awwali ۞ wal aakhiril baaqi bilaa tahawwuli.',arti:'Segala puji bagi Allah Yang Maha Dahulu lagi Maha Awal ۞ dan Maha Akhir lagi Maha Kekal tanpa perubahan.',sumber:'Aqidatul Awam — Bait 2',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Bait ini menetapkan sifat Allah: Al-Qadim (tidak berpermulaan), Al-Awwal (Maha Pertama), Al-Akhir (Maha Terakhir), Al-Baqi (Maha Kekal). Kesemuanya termasuk sifat wajib bagi Allah.'},
    {id:105,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 3 — Salawat atas Nabi ﷺ',arab:'وَالصَّلاَةُ وَالسَّلاَمُ سَرْمَدَا ۞ عَلَى النَّبِيِّ خَيْرِ مَنْ قَدْ وُجِدَا',latin:'Wash shalaatu was salaamu sarmadaa ۞ \'alan nabiyyi khayri man qad wujidaa.',arti:'Shalawat dan salam senantiasa (tercurah) ۞ atas Nabi (Muhammad), sebaik-baik makhluk yang pernah ada.',sumber:'Aqidatul Awam — Bait 3',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Bait ini mempertegas keutamaan Nabi Muhammad ﷺ sebagai makhluk terbaik di antara seluruh ciptaan Allah.'},
    {id:106,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 4 — Keluarga dan Sahabat Nabi',arab:'وَآلِهِ وَصَحْبِهِ وَتَابِعِ ۞ وَكُلِّ هَادٍ لِلْهُدَى وَسَامِعِ',latin:'Wa aalihii wa shahbihii wa taabi\'i ۞ wa kulli haadin lil hudaa wa saami\'i.',arti:'Dan atas keluarganya, para sahabatnya, dan orang-orang yang mengikutinya ۞ serta setiap yang memberi petunjuk ke jalan yang benar dan yang mendengarkannya.',sumber:'Aqidatul Awam — Bait 4',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Bait ini mendoakan keberkahan atas Ahlul Bait (keluarga Nabi), para sahabat, tabi\'in, dan seluruh ulama yang meneruskan petunjuk Nabi ﷺ.'},
    {id:107,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 5 — Tujuan Penulisan Syair',arab:'وَبَعْدُ فَاعْلَمْ بِوُجُوبِ الْمَعْرِفَهْ ۞ مِنَ الإِلَهِ صِفَةً بَعْدَ صِفَهْ',latin:'Wa ba\'du fa\'lam bi wujuubil ma\'rifah ۞ minal ilaahi shifatan ba\'da shifah.',arti:'Kemudian ketahuilah bahwa wajib mengenal ۞ sifat-sifat Allah, satu persatu.',sumber:'Aqidatul Awam — Bait 5',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Inti pesan Aqidatul Awam: mengenal sifat-sifat Allah adalah kewajiban bagi setiap Muslim yang baligh dan berakal (mukallaf). Tanpa mengenal Allah dengan benar, ibadah seseorang tidak sempurna.'},
    {id:108,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 6–8 — Sifat Wajib Allah (1): Wujud–Qidam–Baqa',arab:'فَوَاجِبٌ للهِ عِشْرُونَ صِفَهْ ۞ وَجَائِزٌ بِفَضْلِهِ مَا وَهَبَهْ\nوَيَسْتَحِيلُ ضِدُّهَا وَهْيَ الأُوَلْ ۞ وُجُودُهُ وَقِدَمُهُ وَالبَقَا وَجَلَّ',latin:'Fa waajibun lillaahi \'isyruuna shifah ۞ wa jaa-izun bifadhlihii maa wahabah\nWa yastahiilu dhidduhaa wa hiyal uwal ۞ wujuuduhu wa qidamuhu wal baqaa wa jall.',arti:'Maka wajib bagi Allah dua puluh sifat ۞ dan boleh (jaiz) bagi-Nya dengan karunia-Nya apa yang Dia kehendaki.\nMustahil lawan-lawannya. Inilah yang pertama: ۞ Wujud (Ada), Qidam (Tanpa Permulaan), Baqa (Kekal) — Maha Agung Dia.',sumber:'Aqidatul Awam — Bait 6-8',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Sifat wajib Allah ada 20. Tiga pertama: (1) Wujud — Allah pasti ada, mustahil tiada (Adam). (2) Qidam — Allah tidak berpermulaan, mustahil baharu (Huduts). (3) Baqa — Allah kekal selamanya, mustahil fana (Fana).'},
    {id:109,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 9–10 — Sifat Wajib Allah (2): Mukhalafah–Qiyam–Wahdaniyah',arab:'مُخَالَفَتُهُ لِلْحَوَادِثِ وَالقِيَمْ ۞ بِنَفْسِهِ سُبْحَانَهُ عَمَّا وُهِمْ\nوَوَحْدَانِيَّةُ اللَّهِ تَعَالَى ۞ فِي ذَاتِهِ وَصِفَاتِهِ تَعَلَّى',latin:'Mukhaalafatuhu lil hawaaditsil wa qiyam ۞ binafsihii subhaanahu \'ammaa wuhim\nWa wahdaaniyyatullahi ta\'aalaa ۞ fii dzaatihii wa shifaatihii ta\'allaa.',arti:'Mukhalafah (berbeda) dari segala yang baru, dan Qiyam (berdiri sendiri) ۞ dengan dzat-Nya sendiri — Maha Suci Dia dari apa yang dibayangkan.\nDan Wahdaniyah (Maha Esa) Allah Ta\'ala ۞ dalam dzat-Nya dan sifat-sifat-Nya yang Maha Tinggi.',sumber:'Aqidatul Awam — Bait 9-10',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'(4) Mukhalafatul lil Hawaditsi — Allah berbeda dari semua makhluk, mustahil menyerupai (Mumatsalah). (5) Qiyamuhu Binafsihi — Allah tidak butuh tempat atau pencipta, mustahil butuh kepada selain-Nya (Ihtiyaj). (6) Wahdaniyah — Allah Maha Esa dalam dzat, sifat, dan perbuatan, mustahil berbilang (Ta\'addud).'},
    {id:110,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 11–13 — Sifat Wajib Allah (3): Hayat–Ilmu–Iradat',arab:'حَيٌّ عَلِيمٌ قَادِرٌ مُرِيدٌ ۞ وَسَامِعٌ بَصِيرٌ وَالمُتَكَلِّمُ يُعِيدُ',latin:'Hayyun \'aliimun qaadirun muriidun ۞ wa saami\'un bashiirun wal mutakallamu yu\'iidu.',arti:'(Allah bersifat) Hayat (Hidup), Ilmu (Maha Mengetahui), Qudrat (Maha Kuasa), Iradat (Berkehendak) ۞ dan Sam\'u (Maha Mendengar), Bashar (Maha Melihat), dan Kalam (Berbicara).',sumber:'Aqidatul Awam — Bait 11-13',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Tujuh sifat ma\'ani (makna): (7) Hayat — Allah Maha Hidup. (8) Ilmu — Allah Maha Mengetahui segala sesuatu. (9) Qudrat — Allah Maha Kuasa atas segalanya. (10) Iradat — Allah Maha Berkehendak. (11) Sam\'u — Allah Maha Mendengar. (12) Bashar — Allah Maha Melihat. (13) Kalam — Allah Maha Berbicara (Al-Qur\'an adalah Kalam Allah).'},
    {id:111,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 14–15 — Sifat Ma\'nawiyah (7 Sifat)',arab:'كَوْنُهُ حَيًّا عَلِيمًا قَادِرَا ۞ وَمُرِيدًا مُتَكَلِّمًا بَاصِرَا\nسَامِعًا تِلْكَ صِفَاتٌ سَبْعَةٌ ۞ ثَبَتَتْ لِلَّهِ تَعَالَى مِنَّةٌ',latin:'Kawnuhu hayyan \'aliiman qaadaraa ۞ wa muriidan mutakalliman baashiraa\nSaami\'an tilka shifaatun sab\'atun ۞ tsabatat lillaahi ta\'aalaa minnatun.',arti:'(Allah bersifat) sebagai yang hidup, mengetahui, berkuasa ۞ berkehendak, berbicara, dan melihat.\nMaha Mendengar — itulah tujuh sifat ۞ yang telah tetap bagi Allah Ta\'ala sebagai anugerah.',sumber:'Aqidatul Awam — Bait 14-15',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Sifat ma\'nawiyah adalah kondisi yang menetap pada dzat Allah: keadaan-Nya yang Maha Hidup, Maha Mengetahui, Maha Kuasa, Maha Berkehendak, Maha Berbicara, Maha Melihat, dan Maha Mendengar. Ini mengukuhkan tujuh sifat ma\'ani sebelumnya.'},
    {id:112,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 16 — Mustahil bagi Allah',arab:'وَيَسْتَحِيلُ ضِدُّهَا عَلَيْهِ ۞ فَانْفِ النَّقَائِصَ جُمْلَةً لَدَيْهِ',latin:'Wa yastahiilu dhidduhaa \'alayhi ۞ fanfin naqaa-isha jumlatah ladayh.',arti:'Dan mustahil lawan-lawannya bagi-Nya ۞ maka nafikan (jauhkan) semua kekurangan dari-Nya sepenuhnya.',sumber:'Aqidatul Awam — Bait 16',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Setiap sifat yang wajib bagi Allah, lawannya adalah mustahil. Wajib: Wujud — Mustahil: Adam (tiada). Wajib: Qidam — Mustahil: Huduts (baru). Wajib: Hayat — Mustahil: Maut. Dan seterusnya untuk seluruh 20 sifat wajib.'},
    {id:113,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 17–18 — Sifat Jaiz Allah',arab:'وَجَائِزٌ بِفَضْلِهِ وَعَدْلِهِ ۞ فِعْلُ كُلِّ مُمْكِنٍ أَوْ تَرْكُهُ',latin:'Wa jaa-izun bifadhlihii wa \'adlihii ۞ fi\'lu kulli mumkinin aw tarkuh.',arti:'Dan boleh (jaiz) bagi-Nya berdasarkan karunia dan keadilan-Nya ۞ melakukan atau meninggalkan segala yang mungkin (mumkin).',sumber:'Aqidatul Awam — Bait 17-18',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Sifat jaiz bagi Allah: Allah boleh melakukan atau meninggalkan segala sesuatu yang mungkin (mumkin). Tidak ada yang dapat memaksa Allah. Rezeki, ajal, hidayah — semuanya atas kehendak mutlak Allah.'},
    {id:114,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 19–21 — Sifat Wajib Nabi',arab:'وَكُلُّ مَا أَتَى بِهِ الرَّسُولُ ۞ حَقٌّ وَشَرْعُهُ لَنَا قَبُولُ\nوَوَاجِبٌ فِي حَقِّهِمْ صِدْقٌ وَكَذَا ۞ أَمَانَةٌ وَتَبْلِيغٌ وَالفِطَنُ إِذَا',latin:'Wa kullu maa ataa bihi rasuulu ۞ haqqun wa syar\'uhu lanaa qabuulu\nWa waajibun fii haqqihim shidqun wa kadzaa ۞ amaanah wa tabliighun wal fithan idzaa.',arti:'Dan semua yang dibawa oleh Rasul ۞ adalah kebenaran, dan syariatnya wajib kita terima.\nDan wajib bagi mereka (para nabi): kejujuran (Shidq), demikian juga ۞ amanah (dapat dipercaya), tabligh (menyampaikan), dan kecerdasan (Fathanah).',sumber:'Aqidatul Awam — Bait 19-21',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Sifat wajib bagi para Nabi ada empat: (1) Shidq (jujur) — mustahil Kadzib (dusta). (2) Amanah (dapat dipercaya) — mustahil Khiyanah (berkhianat). (3) Tabligh (menyampaikan wahyu) — mustahil Kitman (menyembunyikan). (4) Fathanah (cerdas) — mustahil Baladah (bodoh).'},
    {id:115,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 22–23 — Sifat Mustahil dan Jaiz Nabi',arab:'وَيَسْتَحِيلُ ضِدُّهَا وَجَائِزُ ۞ عَلَيْهِمُ مَا بَشَرِيَّةٌ تُجِيزُ',latin:'Wa yastahiilu dhidduhaa wa jaa-izu ۞ \'alayhimu maa basyariyyatun tujiizu.',arti:'Dan mustahil lawan-lawannya (pada para nabi), dan boleh (jaiz) ۞ bagi mereka apa yang dibolehkan oleh sifat kemanusiaan.',sumber:'Aqidatul Awam — Bait 22-23',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Para nabi adalah manusia biasa dalam perkara-perkara kemanusiaan seperti makan, minum, tidur, sakit, dan wafat. Yang membedakan adalah mereka terpelihara dari dosa (ma\'shum) dalam hal penyampaian syariat.'},
    {id:116,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 24–25 — Jumlah Nabi dan Rasul',arab:'وَعِدَّةُ الرُّسُلِ الَّذِينَ فِي الكِتَابِ ۞ ثَمَانِيَةٌ وَعِشْرُونَ لِلأَلْبَابِ\nوَنَبِيُّنَا مُحَمَّدٌ أَفْضَلُهُمْ ۞ مُصْطَفَى المُخْتَارُ وَاللَّهُ أَجَلُّهُمْ',latin:'Wa \'iddatur rusulil ladziina fil kitaabi ۞ tsamaaniyah wa \'isyruuna lil albaabi\nWa nabiyyunaa muhammadun afdhuluhum ۞ mushtafal mukhtaaru wallaahu ajalluhum.',arti:'Jumlah rasul yang disebutkan dalam Al-Qur\'an ۞ adalah dua puluh delapan, bagi orang-orang yang berakal.\nDan Nabi kita Muhammad adalah yang paling utama di antara mereka ۞ Al-Mushthafa (yang terpilih) Al-Mukhtar (yang dipilih), dan Allah-lah yang paling mulia dari mereka.',sumber:'Aqidatul Awam — Bait 24-25',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Dalam Al-Qur\'an disebutkan 25 nabi secara jelas. Ulama menyebutkan ada 28 yang disebutkan. Namun jumlah nabi dan rasul seluruhnya hanya diketahui Allah. Yang wajib diimani secara rinci ada 25 yang disebutkan dalam Al-Qur\'an.'},
    {id:117,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 26–28 — Para Rasul Ulul Azmi',arab:'وَأُولُو العَزْمِ مِنْهُمُ السِّتَّةُ ۞ نُوحٌ وَإِبْرَاهِيمُ وَهُوَ القُدْوَةُ\nمُوسَى وَعِيسَى وَالكَلِيمُ الصَّفْوَةُ ۞ مُحَمَّدٌ خَاتَمُهُمْ حَقِيقَةٌ',latin:'Wa ulul \'azmi minhumus sittah ۞ Nuuhun wa Ibraahiimu wa hual qudroh\nMuusaa wa \'Iisaa wal kaliimus shofwah ۞ Muhammadun khaatamuhum haqiiqah.',arti:'Dan Ulul Azmi (yang memiliki keteguhan) di antara mereka ada (lima): ۞ Nuh dan Ibrahim — beliau adalah teladan.\nMusa, Isa, dan Al-Kalim (Musa) pilihan ۞ Muhammad adalah penutup mereka dengan sebenar-benarnya.',sumber:'Aqidatul Awam — Bait 26-28',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Ulul Azmi adalah lima rasul yang memiliki keteguhan dan kesabaran luar biasa: (1) Nabi Nuh AS, (2) Nabi Ibrahim AS, (3) Nabi Musa AS, (4) Nabi Isa AS, dan (5) Nabi Muhammad ﷺ. Mereka adalah rasul-rasul terkemuka yang mendapat ujian paling berat.'},
    {id:118,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 29–30 — Iman kepada Malaikat',arab:'وَآمِنُوا بِالمَلَكِ الكِرَامِ ۞ وَبِكُتُبِ اللَّهِ ذِي الإِنْعَامِ',latin:'Wa aaaminuu bil malakil kiraam ۞ wa bi kutubillahi dzil in\'aam.',arti:'Dan berimanlah kepada malaikat-malaikat yang mulia ۞ dan kepada kitab-kitab Allah yang memiliki karunia.',sumber:'Aqidatul Awam — Bait 29-30',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Rukun iman: (4) Iman kepada Malaikat — makhluk gaib yang diciptakan dari cahaya, selalu taat kepada Allah. (5) Iman kepada Kitab-kitab Allah: Taurat, Zabur, Injil, dan Al-Qur\'an.'},
    {id:119,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 31–32 — Malaikat yang Wajib Dikenal',arab:'جِبْرِيلُ مِيكَائِيلُ وَإِسْرَافِيلُ ۞ وَمَلَكُ المَوْتِ وَالذِّكْرُ جَمِيلُ\nرَقِيبٌ عَتِيدٌ وَمُنْكَرٌ وَنَكِيرُ ۞ وَحَمَلَةُ العَرْشِ وَهُمْ خَبِيرُ',latin:'Jibriilu miikaa-iilu wa israafilu ۞ wa malakul mawti wadz dzikru jamiilu\nRaqiibun \'atiidun wa munkarun wa nakiruu ۞ wa hamalatol \'arsyi wa hum khabiiru.',arti:'Jibril, Mikail, Israfil ۞ dan Malaikat Maut — menyebut mereka adalah kemuliaan.\nRaqib, Atid, Munkar dan Nakir ۞ serta para pemikul Arsy — mereka adalah yang mengetahui.',sumber:'Aqidatul Awam — Bait 31-32',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Sepuluh malaikat yang wajib diimani: (1) Jibril — menyampaikan wahyu. (2) Mikail — mengurus rezeki. (3) Israfil — meniup sangkakala. (4) Izrail — mencabut nyawa. (5) Raqib — mencatat amal baik. (6) Atid — mencatat amal buruk. (7) Munkar & (8) Nakir — bertanya di kubur. (9-10) Pemikul Arsy.'},
    {id:120,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 33–34 — Kitab-Kitab Allah',arab:'وَالتَّوْرَاةُ وَالإِنْجِيلُ وَالزَّبُورُ ۞ وَالفُرْقَانُ فَوْقَهُمُ المَشْهُورُ\nوَصُحُفُ إِبْرَاهِيمَ وَمُوسَى نُزِلَتْ ۞ وَجُمْلَةُ الكُتُبِ مِائَةٌ أُنْزِلَتْ',latin:'Wat tawraatu wal injiilu waz zabuuru ۞ wal furqaanu fawqahum al masyhuur\nWa shuhufu ibraahiima wa muusaa nuzilat ۞ wa jumlatul kutubi mi-atun unzilat.',arti:'Taurat, Injil, dan Zabur ۞ serta Al-Furqan (Al-Qur\'an) yang paling mulia di atasnya — itulah yang terkenal.\nDan shuhuf Ibrahim dan Musa pun diturunkan ۞ dan jumlah seluruh kitab adalah seratus yang diturunkan.',sumber:'Aqidatul Awam — Bait 33-34',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Kitab-kitab Allah yang wajib diimani: Taurat (kepada Nabi Musa), Zabur (kepada Nabi Dawud), Injil (kepada Nabi Isa), Al-Qur\'an (kepada Nabi Muhammad ﷺ). Al-Qur\'an adalah kitab terakhir dan terjaga keasliannya hingga hari kiamat.'},
    {id:121,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 35–36 — Iman kepada Hari Akhir',arab:'وَآمِنَنَّ بِاليَوْمِ الآخِرِ ۞ وَمَا أَتَى بِهِ الكِتَابُ الزَّاهِرُ\nمِنَ البَعْثِ وَالحَشْرِ وَالحِسَابِ ۞ وَالجَنَّةِ النَّارِ وَكُلِّ البَابِ',latin:'Wa aaminanna bil yawmil aakhiri ۞ wa maa ataa bihil kitaabuz zaahiru\nMinal ba\'tsi wal hasyri wal hisaabi ۞ wal jannatin naari wa kullil baabi.',arti:'Dan sungguh berimanlah kepada hari akhir ۞ dan semua yang disebutkan dalam Al-Qur\'an yang bersinar.\nDari kebangkitan, pengumpulan, dan perhitungan amal ۞ surga, neraka, dan seluruh perkaranya.',sumber:'Aqidatul Awam — Bait 35-36',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Iman kepada Hari Akhir mencakup: (1) Hari Kiamat, (2) Kebangkitan dari kubur (Ba\'ts), (3) Padang Mahsyar (Hasyr), (4) Perhitungan amal (Hisab), (5) Timbangan amal (Mizan), (6) Shirath, (7) Surga dan Neraka.'},
    {id:122,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 37–38 — Iman kepada Qadha dan Qadar',arab:'وَآمِنَنَّ بِالقَضَا وَالقَدَرِ ۞ خَيْرِهِمَا وَشَرِّهِمَا فَاصْطَبِرْ\nوَأَنَّ مَا شَاءَ اللَّهُ كَانَ وَمَا ۞ لَمْ يَشَأْ لَمْ يَكُنْ كَذَا يُسَمَّى',latin:'Wa aaminanna bil qadhaa wal qadari ۞ khayrihumaa wa syarrihumaa fash-thabir\nWa anna maa syaa-allaahu kaana wa maa ۞ lam yasya lam yakun kadzaa yusammaa.',arti:'Dan sungguh berimanlah kepada qadha dan qadar ۞ yang baik maupun yang buruk, maka bersabarlah.\nDan sesungguhnya apa yang dikehendaki Allah pasti terjadi, dan apa ۞ yang tidak Dia kehendaki tidak akan terjadi — demikianlah dinamakan.',sumber:'Aqidatul Awam — Bait 37-38',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Iman kepada Qadha dan Qadar (rukun iman ke-6) mencakup empat tingkatan: (1) Ilmu — Allah mengetahui segalanya. (2) Kitabah — Allah mencatat di Lauhul Mahfuzh. (3) Masyiah — semua terjadi atas kehendak Allah. (4) Khalq — Allah menciptakan segalanya.'},
    {id:123,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 39–41 — Nama-Nama Nabi Muhammad ﷺ',arab:'مُحَمَّدٌ أَحْمَدُ وَالمَاحِي ۞ الحَاشِرُ العَاقِبُ نَبِيٌّ ضَاحِي\nمُصْطَفَى المُخْتَارُ خَاتَمُ الرُّسُلِ ۞ وَاللَّهُ صَلَّى عَلَيْهِ فَاقْبَلِ',latin:'Muhammadun Ahmadu wal Maahii ۞ al Haasyiru al \'Aaqibu nabiyyun dhaahii\nMushtafal mukhtaaru khaatamur rusuli ۞ wallaahu shallaa \'alayhi faqbali.',arti:'Muhammad, Ahmad, Al-Mahi (penghapus) ۞ Al-Hasyir (pengumpul), Al-Aqib (penutup) — Nabi yang terang.\nAl-Mushthafa (terpilih), Al-Mukhtar (dipilih), Khatamul Rusul (penutup para rasul) ۞ dan Allah bershalawat atasnya, maka terimalah.',sumber:'Aqidatul Awam — Bait 39-41',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Nama-nama Nabi Muhammad ﷺ: (1) Muhammad — yang terpuji. (2) Ahmad — yang paling terpuji. (3) Al-Mahi — penghapus kekufuran. (4) Al-Hasyir — manusia dikumpulkan di padang mahsyar setelah beliau. (5) Al-Aqib — tidak ada nabi sesudahnya.'},
    {id:124,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 42–44 — Nasab Nabi Muhammad ﷺ',arab:'مُحَمَّدُ بنُ عَبْدِاللَّهِ الهَاشِمِي ۞ القُرَشِيُّ ثُمَّ العَرَبِيُّ الخَاتِمِي\nأُمُّهُ آمِنَةُ بِنتُ وَهَبِ ۞ مُوَلَّدٌ بِمَكَّةَ يَا ذَا اللُّبِّ',latin:'Muhammadu bnu \'abdillaahil haasyimii ۞ al qurasyyiyyu tsummal \'arabiyyul khaatimii\nUmmuhu aamiinatu bintu wahabin ۞ muwalladu bi makkah yaa dzal lubbi.',arti:'Muhammad bin Abdullah Al-Hasyimi ۞ Al-Qurasyi, kemudian Al-Arabi, Al-Khatami (penutup).\nIbunya adalah Aminah binti Wahb ۞ dilahirkan di Mekah, wahai orang yang berakal.',sumber:'Aqidatul Awam — Bait 42-44',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Nasab Nabi ﷺ: Muhammad bin Abdullah bin Abdul Muthallib bin Hasyim — dari kabilah Quraisy bangsa Arab. Ibundanya: Aminah binti Wahb. Nabi ﷺ lahir di Mekah pada Senin, 12 Rabiul Awwal, Tahun Gajah (sekitar 571 M).'},
    {id:125,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 45–47 — Kehidupan Nabi ﷺ',arab:'مَبْعُوثٌ بِمَكَّةَ ثُمَّ هَاجَرَ ۞ لِطَيْبَةَ وَالنَّصْرُ وَالفَتْحُ ظَاهِرُ\nتُوُفِّيَ بِالمَدِينَةِ المُنَوَّرَهْ ۞ صَلَّى عَلَيْهِ اللَّهُ مَا دَامَ الوَرَى',latin:'Mab\'uutsu bi makkah tsumma haajara ۞ li thaybata wan nashru wal fathu zhaahiru\nTuwuffiya bil madinatil munawwarah ۞ shallaa \'alayhillaahu maa daamal waraa.',arti:'Diutus (sebagai nabi) di Mekah, kemudian berhijrah ۞ ke Thaybah (Madinah), dan pertolongan serta kemenangan (Fathu Makkah) tampak.\nWafat di Kota Madinah Al-Munawwarah ۞ semoga Allah senantiasa bershalawat atasnya selama manusia masih ada.',sumber:'Aqidatul Awam — Bait 45-47',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Sejarah singkat: Nabi ﷺ diangkat menjadi nabi di usia 40 tahun di Mekah. Berhijrah ke Madinah pada 622 M. Fathu Makkah terjadi tahun 630 M (8 H). Nabi ﷺ wafat di Madinah pada 12 Rabiul Awwal tahun 11 H (632 M) dalam usia 63 tahun.'},
    {id:126,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 48–50 — Iman kepada Hari Kebangkitan',arab:'وَنُؤْمِنُ بِالبَعْثِ وَبِالجَزَاءِ ۞ مِنَ العَذَابِ وَبِالنَّعِيمِ الدَّائِ\nوَالصِّرَاطِ وَالمِيزَانِ وَالحَوْضِ ۞ وَالشَّفَاعَةِ لَهَا فَيْضٌ غَيْضٌ',latin:'Wa nu\'minu bil ba\'tsi wa bil jazaa-i ۞ minal \'adzaabi wa bin na\'iimid daa-i\nWash shiraathi wal miizaani wal hawdhi ۞ wasy syafaa\'ati lahaa faydun ghaydhun.',arti:'Dan kami beriman kepada kebangkitan dan pembalasan ۞ berupa azab dan kenikmatan yang abadi.\nDan (beriman kepada) Shirath, Mizan (timbangan), dan Telaga (Haudh) ۞ dan syafaat yang darinya terpancar dan mengalir.',sumber:'Aqidatul Awam — Bait 48-50',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Iman kepada hal-hal setelah kematian: (1) Ba\'ts (kebangkitan). (2) Jaza\' (pembalasan). (3) Shirath (jembatan di atas neraka). (4) Mizan (timbangan amal). (5) Haudh (telaga Nabi ﷺ di padang mahsyar). (6) Syafaat Nabi ﷺ bagi umatnya.'},
    {id:127,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 51–53 — Urutan Makhluk Paling Mulia',arab:'وَخَيْرُ هَذِهِ البَرِيَّةِ المُرْسَلُونَ ۞ ثُمَّ الأَنْبِيَاءُ ثُمَّ بَعْدَهُمْ تَعْلُونَ\nمَلاَئِكَةُ اللَّهِ الكِرَامُ ۞ ثُمَّ صَحْبُ المُرْسَلِ الأَعْلاَمُ',latin:'Wa khayru haadzihi al bariyyatil mursaluuna ۞ tsummal anbiyaa-u tsumma ba\'dahum ta\'luuna\nMalaa-ikatullaahil kiraam ۞ tsumma shabhul mursalil a\'laam.',arti:'Dan sebaik-baik makhluk ini adalah para Rasul ۞ kemudian para Nabi, lalu setelah mereka yang lebih tinggi.\nPara malaikat Allah yang mulia ۞ kemudian para sahabat Rasul yang agung.',sumber:'Aqidatul Awam — Bait 51-53',waktu:'Syair aqidah — dibaca dan dihafalkan',faedah:'Urutan makhluk paling mulia menurut Ahlussunnah: (1) Para Rasul, (2) Para Nabi, (3) Para Malaikat, (4) Para Sahabat Nabi ﷺ, (5) Para wali (auliya) Allah.'},
    {id:128,kat:'Aqidatul Awam',icon:'📜',nama:'Bait 54–57 — Penutup Syair (Khatimah)',arab:'هَذَا وَإِنِّي أَسْأَلُ الغَفُورَا ۞ رَبِّي يُجِيزُ هَذِهِ الأُمُورَا\nوَيَجْعَلُ النَّفْعَ بِهَا عَمِيمَا ۞ لِكُلِّ مَنْ تَلاَهَا تَعْلِيمَا\nوَالحَمْدُ لِلَّهِ الَّذِي قَدْ أَتَمَّا ۞ هَذَا النِّظَامَ فَالإِلَهُ أَتَمَّا',latin:'Haadzaa wa innii as-alul ghafuuraa ۞ rabbii yujiizu haadzihi al umuuraa\nWa yaj\'alan naf\'a bihaa \'amiimaa ۞ likulli man talaa-haa ta\'liimaa\nWal hamdu lillaahil ladzii qad atammaa ۞ haadzan nizhaama fal ilaahu atammaa.',arti:'Inilah (syair ini), dan sesungguhnya aku memohon kepada Yang Maha Pengampun ۞ Tuhanku agar memudahkan perkara-perkara ini.\nDan menjadikan manfaatnya merata ۞ bagi setiap orang yang membacanya untuk belajar.\nDan segala puji bagi Allah yang telah menyempurnakan ۞ susunan syair ini, maka Allah-lah yang telah menyempurnakan.',sumber:'Aqidatul Awam — Bait 54-57 (Khatimah)',waktu:'Dibaca sebagai penutup setelah menyelesaikan Aqidatul Awam',faedah:'Inilah penutup nazham Aqidatul Awam karya Syaikh Ahmad al-Marzuqi. Syair ini merangkum pokok aqidah Ahlussunnah wal Jamaah yang wajib diketahui setiap Muslim: 20 sifat wajib Allah, 20 sifat mustahil, 1 sifat jaiz; sifat wajib dan mustahil para Nabi; serta rukun iman kepada malaikat, kitab-kitab, para rasul, hari akhir, dan qadha-qadar.'}
  ];

  var ALL = DATA.slice();
  var currentId = null;

  function groupByKat(list){
    var groups = {};
    var order = [];
    list.forEach(function(d){
      if(!groups[d.kat]){groups[d.kat]=[];order.push(d.kat);}
      groups[d.kat].push(d);
    });
    return {groups:groups,order:order};
  }

  function renderNav(list){
    var el = document.getElementById('doaNavList');
    var statsEl = document.getElementById('statsBar');
    var result = groupByKat(list);
    var html = '';
    result.order.forEach(function(kat){
      html += '<div class="kategori-label">'+kat+'</div>';
      result.groups[kat].forEach(function(d){
        var aktif = d.id === currentId ? ' aktif' : '';
        html += '<button class="doa-item'+aktif+'" id="di-'+d.id+'" onclick="bukaDoa('+d.id+')">' +
          '<span class="di-icon">'+d.icon+'</span>' +
          '<span class="di-name">'+d.nama+'</span>' +
          '</button>';
      });
    });
    el.innerHTML = html || '<div style="padding:16px;text-align:center;color:var(--text-light);font-size:0.8rem;">Tidak ditemukan.</div>';
    statsEl.innerHTML = 'Menampilkan <span>'+list.length+'</span> dari <span>'+DATA.length+'</span> doa';
  }

  renderNav(ALL);

  window.filterDoa = function(q){
    q = q.toLowerCase().trim();
    if(!q){ALL = DATA.slice();}
    else{ALL = DATA.filter(function(d){ return d.nama.toLowerCase().includes(q) || d.kat.toLowerCase().includes(q) || d.arti.toLowerCase().includes(q) || d.waktu.toLowerCase().includes(q); });}
    renderNav(ALL);
  };

  window.bukaDoa = function(id){
    var d = DATA.find(function(x){return x.id===id;});
    if(!d) return;
    currentId = id;

    document.querySelectorAll('.doa-item').forEach(function(b){b.classList.remove('aktif');});
    var btn = document.getElementById('di-'+id);
    if(btn){btn.classList.add('aktif');btn.scrollIntoView({block:'nearest',behavior:'smooth'});}

    // Find prev/next in current filtered list
    var allIds = ALL.map(function(x){return x.id;});
    var idx = allIds.indexOf(id);
    var prevId = idx > 0 ? allIds[idx-1] : null;
    var nextId = idx < allIds.length-1 ? allIds[idx+1] : null;

    document.getElementById('mainContent').innerHTML =
      '<div class="content-header"><div class="ch-badge">'+d.icon+' '+d.kat+'</div><div class="ch-title">'+d.nama+'</div></div>' +
      '<div class="content-body">' +
        '<div class="doa-arab-box"><div class="doa-arab-text">'+d.arab+'</div></div>' +
        '<div class="section-label">Latin / Transliterasi</div>' +
        '<div class="latin-box">'+d.latin+'</div>' +
        '<div class="section-label">Terjemahan</div>' +
        '<div class="arti-box">'+d.arti+'</div>' +
        (d.faedah ? '<div class="section-label">Faedah & Keterangan</div><div class="faedah-box">'+d.faedah+'</div>' : '') +
        '<div style="margin-top:4px;">' +
          '<span class="sumber-box">📚 '+d.sumber+'</span>' +
          '<span class="waktu-box">⏰ '+d.waktu+'</span>' +
        '</div>' +
        '<div class="nav-arrows">' +
          '<button class="nav-btn" '+(prevId?'onclick="bukaDoa('+prevId+')"':'disabled')+'>← Sebelumnya</button>' +
          '<button class="nav-btn" '+(nextId?'onclick="bukaDoa('+nextId+')"':'disabled')+'>Selanjutnya →</button>' +
        '</div>' +
      '</div>';
  };

  bukaDoa(1);
})();
</script>
</body>
</html>
