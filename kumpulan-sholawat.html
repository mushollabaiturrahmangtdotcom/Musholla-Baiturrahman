<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kumpulan Sholawat — Musholla Baiturrahman</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green-deep:#0d3b2e;--green-mid:#155f45;--green-bright:#1e8a5e;--gold:#c9a84c;--gold-light:#e8c97a;--cream:#f9f5ee;--cream-dark:#ede8dc;--white:#ffffff;--text-dark:#1a1a1a;--text-mid:#4a4a4a;--text-light:#7a7a7a;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--text-dark);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(13,59,46,0.97);backdrop-filter:blur(12px);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;border-bottom:1px solid rgba(201,168,76,0.3);}
  .nav-brand{display:flex;align-items:center;gap:12px;text-decoration:none;}
  .nav-brand img{height:38px;width:auto;}
  .nav-brand span{font-size:0.85rem;font-weight:600;color:var(--white);}
  .nav-back{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,0.8);text-decoration:none;font-size:0.82rem;font-weight:500;padding:7px 14px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);transition:all 0.2s;}
  .nav-back:hover{background:rgba(255,255,255,0.1);color:var(--gold-light);}
  .main-layout{display:flex;height:calc(100vh - 64px);margin-top:64px;}
  .sidebar{width:280px;flex-shrink:0;background:var(--white);border-right:1px solid var(--cream-dark);display:flex;flex-direction:column;}
  .sidebar-header{padding:16px;background:linear-gradient(135deg,var(--green-deep),var(--green-mid));flex-shrink:0;}
  .sidebar-header h2{font-family:'Amiri',serif;font-size:1.2rem;color:var(--white);margin-bottom:4px;}
  .sidebar-header p{font-size:0.72rem;color:rgba(255,255,255,0.6);}
  .sholawat-list{flex:1;overflow-y:auto;padding:6px;}
  .sholawat-list::-webkit-scrollbar{width:4px;}
  .sholawat-list::-webkit-scrollbar-thumb{background:var(--cream-dark);border-radius:2px;}
  .sh-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer;border:none;width:100%;text-align:left;background:transparent;transition:background 0.15s;}
  .sh-item:hover{background:rgba(30,138,94,0.08);}
  .sh-item.aktif{background:var(--green-deep);}
  .sh-item.aktif .sh-num,.sh-item.aktif .sh-name,.sh-item.aktif .sh-info{color:var(--white)!important;}
  .sh-item.aktif .sh-num{background:rgba(255,255,255,0.15);}
  .sh-num{width:30px;height:30px;flex-shrink:0;background:rgba(30,138,94,0.1);border-radius:6px;display:grid;place-items:center;font-size:0.72rem;font-weight:700;color:var(--green-bright);}
  .sh-text{flex:1;min-width:0;}
  .sh-name{font-size:0.83rem;font-weight:600;color:var(--text-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sh-info{font-size:0.68rem;color:var(--text-light);margin-top:1px;}
  .content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .content-header{padding:20px 28px;background:linear-gradient(135deg,var(--green-deep),var(--green-mid));flex-shrink:0;text-align:center;}
  .ch-badge{display:inline-block;background:rgba(201,168,76,0.2);color:var(--gold-light);font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:3px 12px;border-radius:20px;border:1px solid rgba(201,168,76,0.3);margin-bottom:8px;}
  .ch-title{font-family:'Amiri',serif;font-size:1.5rem;color:var(--white);}
  .ch-sub{font-size:0.75rem;color:rgba(255,255,255,0.6);margin-top:4px;}
  .content-body{flex:1;overflow-y:auto;padding:24px 28px;}
  .content-body::-webkit-scrollbar{width:5px;}
  .content-body::-webkit-scrollbar-thumb{background:var(--cream-dark);border-radius:3px;}
  .arab-box{background:linear-gradient(135deg,var(--green-deep),var(--green-mid));border-radius:16px;padding:24px 28px;margin-bottom:20px;border-top:3px solid var(--gold);text-align:right;}
  .arab-text{font-family:'Amiri',serif;font-size:1.6rem;line-height:2.6;color:var(--white);direction:rtl;white-space:pre-line;}
  .section-label{font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--green-bright);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--cream-dark);}
  .latin-box{font-size:0.88rem;color:var(--green-mid);font-style:italic;line-height:2;padding:14px 18px;background:rgba(30,138,94,0.05);border-radius:8px;margin-bottom:16px;white-space:pre-line;}
  .arti-box{font-size:0.88rem;color:var(--text-mid);line-height:2;padding:14px 18px;background:var(--white);border-left:3px solid var(--green-bright);border-radius:0 8px 8px 0;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.04);white-space:pre-line;}
  .keutamaan-box{background:rgba(201,168,76,0.08);border:1px solid rgba(201,168,76,0.25);border-radius:12px;padding:16px 20px;font-size:0.82rem;color:var(--text-mid);line-height:1.8;}
  .keutamaan-box strong{color:var(--green-deep);}
  .nav-arrows{display:flex;gap:10px;margin-top:20px;margin-bottom:8px;}
  .nav-btn{flex:1;padding:10px;border:1.5px solid var(--cream-dark);border-radius:8px;background:var(--white);font-size:0.8rem;font-weight:600;color:var(--green-deep);cursor:pointer;transition:all 0.2s;text-align:center;}
  .nav-btn:hover:not(:disabled){background:var(--green-deep);color:var(--white);border-color:var(--green-deep);}
  .nav-btn:disabled{opacity:0.35;cursor:not-allowed;}
  .placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px;}
  .placeholder-icon{font-size:3rem;opacity:0.35;}
  .placeholder h3{font-family:'Amiri',serif;font-size:1.4rem;color:var(--green-deep);}
  .placeholder p{font-size:0.85rem;color:var(--text-light);line-height:1.7;max-width:340px;}
  @media(max-width:768px){.sidebar{width:240px;}nav .nav-brand span{display:none;}}
  @media(max-width:520px){.main-layout{flex-direction:column;}.sidebar{width:100%;height:200px;border-right:none;border-bottom:1px solid var(--cream-dark);}.sholawat-list{display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;}.sh-item{min-width:140px;}.content-body{padding:16px;}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-brand"><img src="images/logo_nav.png" alt="Logo"><span>Musholla Baiturrahman</span></a>
  <a href="index.html" class="nav-back">← Kembali</a>
</nav>
<div class="main-layout">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>🌙 Kumpulan Sholawat</h2>
      <p>Sholawat kepada Nabi Muhammad ﷺ</p>
    </div>
    <div class="sholawat-list" id="sholawatList"></div>
  </div>
  <div class="content" id="mainContent">
    <div class="placeholder">
      <div class="placeholder-icon">🌙</div>
      <h3>Kumpulan Sholawat</h3>
      <p>Pilih sholawat dari daftar di sebelah kiri untuk mulai membaca.</p>
      <div style="font-family:'Amiri',serif;font-size:1.3rem;color:var(--gold);margin-top:8px;">اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ</div>
    </div>
  </div>
</div>
<script>
(function(){
  var DATA = [
    {
      id:1, nama:'Sholawat Ibrahimiyah', kategori:'Wajib dalam Sholat',
      arab:'اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ\nكَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ\nإِنَّكَ حَمِيدٌ مَجِيدٌ\nاللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ\nكَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ\nإِنَّكَ حَمِيدٌ مَجِيدٌ',
      latin:'Allāhumma ṣalli \'alā Muḥammadin wa \'alā āli Muḥammad\nkamā ṣallayta \'alā Ibrāhīma wa \'alā āli Ibrāhīm\ninnaka Ḥamīdun Majīd\nAllāhumma bārik \'alā Muḥammadin wa \'alā āli Muḥammad\nkamā bārakta \'alā Ibrāhīma wa \'alā āli Ibrāhīm\ninnaka Ḥamīdun Majīd',
      arti:'Ya Allah, limpahkanlah sholawat kepada Muhammad dan kepada keluarga Muhammad,\nsebagaimana Engkau telah limpahkan sholawat kepada Ibrahim dan kepada keluarga Ibrahim.\nSesungguhnya Engkau Maha Terpuji lagi Maha Mulia.\nYa Allah, berkahilah Muhammad dan keluarga Muhammad,\nsebagaimana Engkau telah memberkahi Ibrahim dan keluarga Ibrahim.\nSesungguhnya Engkau Maha Terpuji lagi Maha Mulia.',
      keutamaan:'Sholawat Ibrahimiyah adalah sholawat yang diajarkan langsung oleh Nabi ﷺ ketika para sahabat bertanya cara bersholawat. Diriwayatkan oleh Imam Bukhari dan Muslim. Dibaca wajib dalam setiap sholat pada tasyahud akhir. Ini adalah sholawat yang paling utama dan paling shahih.'
    },
    {
      id:2, nama:'Sholawat Nariyah', kategori:'Sholawat Populer',
      arab:'اللَّهُمَّ صَلِّ صَلَاةً كَامِلَةً وَسَلِّمْ سَلَامًا تَامًّا\nعَلَى سَيِّدِنَا مُحَمَّدٍ\nالَّذِي تَنْحَلُّ بِهِ الْعُقَدُ\nوَتَنْفَرِجُ بِهِ الْكُرَبُ\nوَتُقْضَى بِهِ الْحَوَائِجُ\nوَتُنَالُ بِهِ الرَّغَائِبُ وَحُسْنُ الْخَوَاتِمِ\nوَيُسْتَسْقَى الْغَمَامُ بِوَجْهِهِ الْكَرِيمِ\nوَعَلَى آلِهِ وَصَحْبِهِ\nفِي كُلِّ لَمْحَةٍ وَنَفَسٍ\nبِعَدَدِ كُلِّ مَعْلُومٍ لَكَ',
      latin:'Allāhumma ṣalli ṣalātan kāmilatan wa sallim salāman tāmman\n\'alā sayyidinā Muḥammadin\nallażī tanḥallu bihil \'uqadu\nwa tanfariju bihil kurabu\nwa tuqḍā bihil ḥawā\'iju\nwa tunālu bihir ragā\'ibu wa ḥusnul khawātim\nwa yustasqal gamāmu biwajhihil karīm\nwa \'alā ālihī wa ṣaḥbihī\nfī kulli lamḥatin wa nafasin\nbi\'adadi kulli ma\'lūmin lak',
      arti:'Ya Allah, limpahkanlah sholawat yang sempurna dan salam yang lengkap\nkepada junjungan kami Muhammad,\nyang dengan sebabnya terurai segala ikatan,\nhilang segala kesusahan,\nterpenuhi segala hajat,\ntercapai segala keinginan dan khusnul khatimah,\nserta turun hujan dengan sebab wajahnya yang mulia,\ndan kepada keluarga dan para sahabatnya,\nsetiap kedipan mata dan hembusan nafas,\nsebanyak bilangan yang Engkau ketahui.',
      keutamaan:'Sholawat Nariyah dikenal juga sebagai Sholawat Tafrijiyah (pembuka kesulitan). Banyak ulama menganjurkan membacanya 11 kali setelah sholat fardhu, atau 4444 kali dalam satu majelis untuk hajat besar. Diyakini ampuh untuk membuka jalan rezeki, menyembuhkan penyakit, dan menghilangkan kesulitan.'
    },
    {
      id:3, nama:'Sholawat Badar', kategori:'Sholawat Populer',
      arab:'صَلَاةُ اللهِ سَلَامُ اللهِ\nعَلَى طَهَ رَسُولِ اللهِ\nصَلَاةُ اللهِ سَلَامُ اللهِ\nعَلَى يَاسِيْنَ حَبِيبِ اللهِ\n\nتَوَسَّلْنَا بِبِسْمِ اللهِ\nوَبِالْهَادِي رَسُولِ اللهِ\nوَكُلِّ مُجَاهِدٍ لِلَّهِ\nبِأَهْلِ الْبَدْرِ يَا اللهُ\n\nإِلَهِي سَلِّمِ الْأُمَّةَ\nمِنَ الآفَاتِ وَالنِّقْمَةِ\nوَمِنْ هَمٍّ وَمِنْ غُمَّةٍ\nبِأَهْلِ الْبَدْرِ يَا اللهُ',
      latin:'Ṣalātullāhi salāmullāhi\n\'alā Ṭāhā rasūlillāh\nṢalātullāhi salāmullāhi\n\'alā Yāsīna ḥabībillāh\n\nTawassalnā bibismillāh\nwa bil hādī rasūlillāh\nwa kulli mujāhidin lillāh\nbi-ahlil badri yā Allāh\n\nIlāhī sallimil ummah\nminat-āfāti wan-niqmah\nwa min hammin wa min gummah\nbi-ahlil badri yā Allāh',
      arti:'Sholawat Allah dan salam Allah\natas Thaha (Muhammad) utusan Allah.\nSholawat Allah dan salam Allah\natas Yasin (Muhammad) kekasih Allah.\n\nKami bertawasul dengan bismillah\ndan dengan petunjuk utusan Allah,\ndan dengan semua pejuang di jalan Allah,\ndengan perantara ahli Badar, ya Allah.\n\nWahai Tuhanku, selamatkanlah umat ini\ndari segala bencana dan siksaan,\ndan dari kegelisahan dan kesempitan,\ndengan perantara ahli Badar, ya Allah.',
      keutamaan:'Sholawat Badar sering dibacakan pada peringatan Maulid Nabi, majelis dzikir, dan haul. Mengandung tawasul kepada para pejuang Perang Badar yang merupakan sebaik-baik sahabat Nabi ﷺ. Sangat dikenal dan dicintai oleh umat Islam Indonesia.'
    },
    {
      id:4, nama:'Sholawat Munjiyat', kategori:'Sholawat Amalan',
      arab:'اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ\nصَلَاةً تُنَجِّيْنَا بِهَا مِنْ جَمِيْعِ الْأَهْوَالِ وَالْآفَاتِ\nوَتَقْضِي لَنَا بِهَا جَمِيْعَ الْحَاجَاتِ\nوَتُطَهِّرُنَا بِهَا مِنْ جَمِيْعِ السَّيِّئَاتِ\nوَتَرْفَعُنَا بِهَا عِنْدَكَ أَعْلَى الدَّرَجَاتِ\nوَتُبَلِّغُنَا بِهَا أَقْصَى الْغَايَاتِ\nمِنْ جَمِيْعِ الْخَيْرَاتِ فِي الْحَيَاةِ وَبَعْدَ الْمَمَاتِ',
      latin:'Allāhumma ṣalli \'alā sayyidinā Muḥammad\nṣalātan tunajjīnā bihā min jamī\'il-ahwāli wal-āfāt\nwa taqḍī lanā bihā jamī\'al-ḥājāt\nwa tuṭahhirunā bihā min jamī\'is-sayyi\'āt\nwa tarfa\'unā bihā \'indaka a\'lad-darajāt\nwa tuballigụnā bihā aqṣal-ghāyāt\nmin jamī\'il-khayrāti fil-ḥayāti wa ba\'dal-mamāt',
      arti:'Ya Allah, limpahkanlah sholawat kepada junjungan kami Muhammad,\nsholawat yang dengannya Engkau selamatkan kami dari segala ketakutan dan bencana,\nEngkau penuhi segala hajat kami,\nEngkau bersihkan kami dari segala kejelekan,\nEngkau angkat derajat kami setinggi-tingginya di sisi-Mu,\ndan Engkau sampaikan kami kepada tujuan tertinggi\ndari segala kebaikan dalam kehidupan maupun setelah kematian.',
      keutamaan:'Sholawat Munjiyat berarti "sholawat penyelamat". Diajarkan para ulama sebagai amalan rutin untuk keselamatan dunia dan akhirat. Dianjurkan dibaca minimal sekali setelah sholat Subuh dan Maghrib. Sangat dianjurkan bagi yang menghadapi kesulitan dan ingin dimudahkan urusannya.'
    },
    {
      id:5, nama:'Sholawat Thibbil Qulub', kategori:'Sholawat Amalan',
      arab:'اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ\nطِبِّ الْقُلُوبِ وَدَوَائِهَا\nوَعَافِيَةِ الْأَبْدَانِ وَشِفَائِهَا\nوَنُورِ الْأَبْصَارِ وَضِيَائِهَا\nوَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ',
      latin:'Allāhumma ṣalli \'alā sayyidinā Muḥammad\nṭibbil qulūbi wa dawā\'ihā\nwa \'āfiyatil abdāni wa shifā\'ihā\nwa nūril abṣāri wa ḍiyā\'ihā\nwa \'alā ālihī wa ṣaḥbihī wa sallim',
      arti:'Ya Allah, limpahkanlah sholawat kepada junjungan kami Muhammad,\nobat hati dan penyembuhnya,\nsehat badan dan kesembuhannya,\ncahaya mata dan sinarnya,\nserta kepada keluarga dan para sahabatnya, dan limpahkanlah salam.',
      keutamaan:'Sholawat Thibbil Qulub bermakna "obat hati". Sangat dianjurkan bagi yang sedang sakit, gelisah, atau hatinya gundah. Dibaca 7 kali sambil mengusapkan tangan ke bagian yang sakit diyakini membawa kesembuhan atas izin Allah.'
    },
    {
      id:6, nama:'Sholawat Fatih', kategori:'Sholawat Populer',
      arab:'اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ\nالْفَاتِحِ لِمَا أُغْلِقَ\nوَالْخَاتِمِ لِمَا سَبَقَ\nوَنَاصِرِ الْحَقِّ بِالْحَقِّ\nوَالْهَادِي إِلَى صِرَاطِكَ الْمُسْتَقِيمِ\nوَعَلَى آلِهِ حَقَّ قَدْرِهِ وَمِقْدَارِهِ الْعَظِيمِ',
      latin:'Allāhumma ṣalli \'alā sayyidinā Muḥammadin\nal-fātiḥi limā ugliqa\nwal-khātimi limā sabaqa\nwa nāṣiril-ḥaqqi bil-ḥaqq\nwal-hādī ilā ṣirāṭikal-mustaqīm\nwa \'alā ālihī ḥaqqa qadrihī wa miqdārihil-\'aẓīm',
      arti:'Ya Allah, limpahkanlah sholawat kepada junjungan kami Muhammad,\nyang membuka apa yang tertutup,\nyang menyempurnakan apa yang sebelumnya,\nyang menolong kebenaran dengan kebenaran,\nyang memberi petunjuk menuju jalan-Mu yang lurus,\nbeserta keluarganya, sesuai dengan kadar dan kedudukannya yang agung.',
      keutamaan:'Sholawat Fatih diamalkan oleh para ulama dan ahli tasawuf, terutama dalam Thariqah Tijaniyah. Para syaikh menyebutkan bahwa satu kali membaca Sholawat Fatih setara dengan 600.000 kali sholawat biasa. Dibaca secara rutin setelah sholat fardhu untuk membuka pintu rezeki dan ilmu.'
    },
    {
      id:7, nama:'Sholawat Ma\'tsur', kategori:'Dari Sunnah',
      arab:'اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَأَزْوَاجِهِ وَذُرِّيَّتِهِ\nكَمَا صَلَّيْتَ عَلَى آلِ إِبْرَاهِيمَ\nوَبَارِكْ عَلَى مُحَمَّدٍ وَأَزْوَاجِهِ وَذُرِّيَّتِهِ\nكَمَا بَارَكْتَ عَلَى آلِ إِبْرَاهِيمَ\nإِنَّكَ حَمِيدٌ مَجِيدٌ',
      latin:'Allāhumma ṣalli \'alā Muḥammadin wa azwājihī wa żurriyyatih\nkamā ṣallayta \'alā āli Ibrāhīm\nwa bārik \'alā Muḥammadin wa azwājihī wa żurriyyatih\nkamā bārakta \'alā āli Ibrāhīm\ninnaka Ḥamīdun Majīd',
      arti:'Ya Allah, limpahkanlah sholawat kepada Muhammad, istri-istri beliau, dan keturunan beliau,\nsebagaimana Engkau limpahkan sholawat kepada keluarga Ibrahim.\nDan berkahilah Muhammad, istri-istri beliau, dan keturunan beliau,\nsebagaimana Engkau berkahi keluarga Ibrahim.\nSesungguhnya Engkau Maha Terpuji lagi Maha Mulia.',
      keutamaan:'Diriwayatkan oleh Imam Bukhari dan Muslim dari Abu Humaid As-Sa\'idi radhiyallahu \'anhu. Sholawat ini mencakup sholawat untuk Nabi ﷺ beserta seluruh istri-istri dan keturunan beliau. Merupakan salah satu bacaan tasyahud yang valid dalam berbagai mazhab fikih.'
    },
    {
      id:8, nama:'Sholawat Jibril', kategori:'Sholawat Ringkas',
      arab:'صَلَّى اللهُ عَلَى مُحَمَّدٍ',
      latin:'Ṣallallāhu \'alā Muḥammad',
      arti:'Semoga Allah limpahkan sholawat kepada Muhammad.',
      keutamaan:'Sholawat ringkas yang diajarkan oleh Malaikat Jibril kepada Nabi ﷺ. Nabi ﷺ bersabda: "Barangsiapa yang bersholawat kepadaku sekali, maka Allah akan bersholawat kepadanya sepuluh kali, dihapus sepuluh dosanya, dan diangkat sepuluh derajatnya." (HR. An-Nasa\'i). Sangat mudah dibaca kapan saja dan di mana saja.'
    },
    {
      id:9, nama:'Sholawat Nuril Anwar', kategori:'Sholawat Amalan',
      arab:'اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى\nنُورِ الْأَنْوَارِ\nوَسِرِّ الْأَسْرَارِ\nوَتِرْيَاقِ الْأَغْيَارِ\nوَمِفْتَاحِ بَابِ الْيَسَارِ\nسَيِّدِنَا مُحَمَّدٍ الْمُخْتَارِ\nوَآلِهِ الْأَطْهَارِ\nوَأَصْحَابِهِ الْأَخْيَارِ\nعَدَدَ نِعَمِ اللهِ وَإِفْضَالِهِ',
      latin:'Allāhumma ṣalli wa sallim \'alā\nnūril-anwāri\nwa sirril-asrāri\nwa tiryāqil-agyāri\nwa miftāḥi bābil-yasāri\nsayyidinā Muḥammadil-mukhtāri\nwa ālihil-aṭhāri\nwa aṣḥābihil-akhyāri\n\'adada ni\'amillāhi wa ifḍālih',
      arti:'Ya Allah, limpahkanlah sholawat dan salam kepada\ncahaya dari segala cahaya,\nrahasia dari segala rahasia,\npenawar dari segala penyakit,\npembuka pintu kemudahan,\njunjungan kami Muhammad yang terpilih,\nbeserta keluarganya yang suci,\ndan sahabat-sahabatnya yang mulia,\nsebanyak nikmat Allah dan karunia-Nya.',
      keutamaan:'Sholawat Nuril Anwar mengandung sifat-sifat keagungan Nabi ﷺ sebagai cahaya, rahasia ilahi, penawar, dan pembuka kemudahan. Dibaca untuk memperoleh cahaya ilmu, kelapangan hati, dan kemudahan dalam segala urusan. Dianjurkan dibaca 41 kali setelah sholat Isya.'
    },
    {
      id:10, nama:'Sholawat Syifa\'', kategori:'Sholawat Amalan',
      arab:'اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ\nصَلَاةً تَشْفِي بِهَا أَسْقَامَنَا\nوَتُزِيلُ بِهَا هُمُومَنَا وَغُمُومَنَا\nوَتَكْشِفُ بِهَا كُرُوبَنَا\nوَتُيَسِّرُ بِهَا أُمُورَنَا\nوَتَجْلُو بِهَا صُدُورَنَا\nوَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِيْنَ',
      latin:'Allāhumma ṣalli \'alā sayyidinā Muḥammad\nṣalātan tasyfī bihā asqāmanā\nwa tuzīlu bihā humūmanā wa gumūmanā\nwa takshifu bihā kurūbanā\nwa tuyassiru bihā umūranā\nwa tajlū bihā ṣudūranā\nwa \'alā ālihī wa ṣaḥbihī ajma\'īn',
      arti:'Ya Allah, limpahkanlah sholawat kepada junjungan kami Muhammad,\nsholawat yang dengannya Engkau sembuhkan penyakit kami,\nhilangkan kegelisahan dan kesedihan kami,\nlenyapkan kesusahan kami,\nmudahkan urusan kami,\nterangi dan jernihkan dada kami,\ndan kepada seluruh keluarga dan sahabat beliau.',
      keutamaan:'Sholawat Syifa\' (penyembuh) sangat dianjurkan bagi yang sedang sakit, baik sakit fisik maupun sakit hati. Dibaca 7 atau 41 kali sambil berdoa kesembuhan untuk diri sendiri maupun orang lain yang sedang sakit, sebagai bentuk ikhtiar dan tawakkal kepada Allah.'
    },
    {
      id:11, nama:'Sholawat Kamaliyah', kategori:'Sholawat Amalan',
      arab:'اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ\nوَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ\nصَلَاةً كَامِلَةً دَائِمَةً\nبِدَوَامِ مُلْكِكَ وَكَمَالِ جَلَالِكَ\nوَسَلِّمْ سَلَامًا تَامًّا\nبِتَمَامِ عِلْمِكَ وَعَظِيمِ قُدْرَتِكَ',
      latin:'Allāhumma ṣalli \'alā sayyidinā Muḥammad\nwa \'alā āli sayyidinā Muḥammad\nṣalātan kāmilatan dā\'imatan\nbidawāmi mulkika wa kamāli jalālik\nwa sallim salāman tāmman\nbitamāmi \'ilmika wa \'aẓīmi qudratik',
      arti:'Ya Allah, limpahkanlah sholawat kepada junjungan kami Muhammad\ndan kepada keluarga junjungan kami Muhammad,\nsholawat yang sempurna dan abadi,\nseabadi kerajaan-Mu dan sesempurna keagungan-Mu,\ndan limpahkanlah salam yang sempurna,\nselengkap ilmu-Mu dan seagung kekuasaan-Mu.',
      keutamaan:'Sholawat Kamaliyah (sholawat kesempurnaan) mengandung doa agar sholawat kita diterima Allah dengan derajat sempurna, abadi selama keabadian Allah. Diamalkan para ulama sebagai wiridan harian untuk mendapatkan kesempurnaan dalam ibadah dan kehidupan.'
    },
    {
      id:12, nama:'Sholawat Tunjina', kategori:'Sholawat Amalan',
      arab:'اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ\nصَلَاةً تُنْجِيْنَا بِهَا مِنَ الْفِتَنِ وَالطُّوفَانِ\nوَتَحْفَظُنَا بِهَا مِنَ الشَّيْطَانِ\nوَتُدْخِلُنَا بِهَا فِي أَمَانِكَ وَأَمَانِ رَسُولِكَ\nوَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ',
      latin:'Allāhumma ṣalli \'alā sayyidinā Muḥammad\nṣalātan tunjīnā bihā minal-fitani waṭ-ṭūfān\nwa taḥfaẓunā bihā minasy-syayṭān\nwa tudkhilunā bihā fī amānika wa amāni rasūlik\nwa \'alā ālihī wa ṣaḥbihī wa sallim',
      arti:'Ya Allah, limpahkanlah sholawat kepada junjungan kami Muhammad,\nsholawat yang dengannya Engkau selamatkan kami dari fitnah dan bencana,\nEngkau jaga kami dari (godaan) setan,\nEngkau masukkan kami ke dalam perlindungan-Mu dan perlindungan Rasul-Mu,\ndan kepada keluarga dan sahabat-sahabatnya, serta limpahkanlah salam.',
      keutamaan:'Sholawat Tunjina dibaca untuk memohon keselamatan dari berbagai fitnah, bencana, dan godaan setan. Sangat dianjurkan pada zaman yang penuh fitnah. Dibaca 10 kali setelah sholat Subuh sebagai benteng perlindungan sepanjang hari.'
    },
    {
      id:13, nama:'Sholawat Al-\'Ala', kategori:'Dari Sunnah',
      arab:'اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ\nوَصَلِّ عَلَى الْمُؤْمِنِيْنَ وَالْمُؤْمِنَاتِ\nوَالْمُسْلِمِيْنَ وَالْمُسْلِمَاتِ',
      latin:'Allāhumma ṣalli \'alā Muḥammadin \'abdika wa rasūlik\nwa ṣalli \'alal-mu\'minīna wal-mu\'mināt\nwal-muslimīna wal-muslimāt',
      arti:'Ya Allah, limpahkanlah sholawat kepada Muhammad, hamba-Mu dan Rasul-Mu,\ndan limpahkanlah sholawat kepada orang-orang mukmin laki-laki dan perempuan,\nserta orang-orang muslim laki-laki dan perempuan.',
      keutamaan:'Diriwayatkan oleh Imam Muslim dari Abu Musa Al-Asy\'ari. Sholawat ini istimewa karena mencakup seluruh umat mukmin dan muslim, sehingga pahala sholawatnya mengalir kepada semua umat Islam. Dianjurkan dibaca setelah sholat Jumat.'
    },
    {
      id:14, nama:'Sholawat Busyro', kategori:'Sholawat Amalan',
      arab:'اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ\nبُشْرَى الْقُلُوبِ وَأُنْسِ الْأَرْوَاحِ\nوَسُرُورِ النُّفُوسِ وَنُزْهَةِ الْأَشْبَاحِ\nوَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ',
      latin:'Allāhumma ṣalli \'alā sayyidinā Muḥammad\nbusyrāl-qulūbi wa unil-arwāḥ\nwa surūrin-nufūsi wa nuzhatil-asybaḥ\nwa \'alā ālihī wa ṣaḥbihī wa sallim',
      arti:'Ya Allah, limpahkanlah sholawat kepada junjungan kami Muhammad,\nkabar gembira bagi hati dan penghibur ruh,\nkebahagiaan jiwa dan kesenangan raga,\ndan kepada keluarga dan sahabat-sahabatnya, serta limpahkanlah salam.',
      keutamaan:'Sholawat Busyro (kabar gembira) dibaca untuk melegakan hati yang sedih dan membawa kebahagiaan. Para ulama menganjurkannya bagi yang sedang berduka, stress, atau kehilangan semangat hidup. Dibaca 3 kali setelah sholat Dhuha untuk menjaga semangat dan kegembiraan sepanjang hari.'
    },
    {
      id:15, nama:'Sholawat Sa\'adah', kategori:'Sholawat Amalan',
      arab:'اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ\nصَلَاةً تُسْعِدُنَا بِهَا فِي الدُّنْيَا وَالْآخِرَةِ\nوَتُقَرِّبُنَا بِهَا مِنْكَ وَمِنْ رَسُولِكَ\nوَتَجْمَعُنَا بِهِ فِي الْفِرْدَوْسِ الْأَعْلَى\nوَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِيْنَ',
      latin:'Allāhumma ṣalli \'alā sayyidinā Muḥammad\nṣalātan tus\'idunā bihā fid-dunyā wal-ākhirah\nwa tuqarribunā bihā minka wa min rasūlik\nwa tajma\'unā bihī fil-firdausil-a\'lā\nwa \'alā ālihī wa ṣaḥbihī ajma\'īn',
      arti:'Ya Allah, limpahkanlah sholawat kepada junjungan kami Muhammad,\nsholawat yang dengannya Engkau bahagiakan kami di dunia dan akhirat,\nEngkau dekatkan kami kepada-Mu dan kepada Rasul-Mu,\ndan Engkau kumpulkan kami bersamanya di Firdaus yang tertinggi,\ndan kepada seluruh keluarga dan sahabat beliau.',
      keutamaan:'Sholawat Sa\'adah (kebahagiaan) mengandung harapan dikumpulkan bersama Nabi ﷺ di Firdaus. Dianjurkan dibaca setiap hari menjelang tidur sebagai doa penutup hari, dengan harapan agar meninggal dalam keadaan khusnul khatimah.'
    },
    {
      id:16, nama:'Sholawat Nuurul Musthafa', kategori:'Sholawat Amalan',
      arab:'اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ\nعَلَى نُورِ الْأَنْبِيَاءِ وَخَاتَمِ الرُّسُلِ\nسَيِّدِنَا مُحَمَّدٍ الْمُصْطَفَى\nصَاحِبِ الْمَقَامِ الْمَحْمُودِ\nوَالْحَوْضِ الْمَوْرُودِ\nوَاللِّوَاءِ الْمَعْقُودِ\nوَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِيْنَ',
      latin:'Allāhumma ṣalli wa sallim wa bārik\n\'alā nūril-anbiyā\'i wa khātamirrusul\nsayyidinā Muḥammadil-muṣṭafā\nṣāḥibil-maqāmil-maḥmūd\nwal-ḥauḍil-mawrūd\nwallīwā\'il-ma\'qūd\nwa \'alā ālihī wa ṣaḥbihī ajma\'īn',
      arti:'Ya Allah, limpahkanlah sholawat, salam, dan keberkahan\nkepada cahaya para nabi dan penutup para rasul,\njunjungan kami Muhammad Al-Musthafa,\nyang memiliki Maqam Mahmud (derajat tertinggi di akhirat),\ntelaga Al-Kautsar yang banyak dikunjungi,\ndan panji Al-Hamd yang terikat,\ndan kepada seluruh keluarga dan sahabat beliau.',
      keutamaan:'Sholawat yang menyebut tiga keistimewaan Nabi ﷺ di akhirat: Maqam Mahmud (syafaat agung), Telaga Al-Kautsar, dan Panji Al-Hamd. Dibaca untuk memohon syafaat Nabi ﷺ di hari kiamat. Dianjurkan dibaca setelah adzan Shubuh dan Ashar.'
    },
    {
      id:17, nama:'Sholawat \'Ala Nabiyyil Ummiy', kategori:'Dari Sunnah',
      arab:'اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ النَّبِيِّ الْأُمِّيِّ\nوَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ',
      latin:'Allāhumma ṣalli \'alā Muḥammadin-nabiyyil-ummiyy\nwa \'alā ālihī wa ṣaḥbihī wa sallim',
      arti:'Ya Allah, limpahkanlah sholawat kepada Muhammad, Nabi yang ummi (tidak membaca dan menulis),\ndan kepada keluarga dan sahabat-sahabatnya, serta limpahkanlah salam.',
      keutamaan:'Kata "Nabiyyil Ummiy" merujuk pada sifat Nabi ﷺ yang tidak bisa membaca dan menulis namun membawa Al-Quran — salah satu mu\'jizat terbesar beliau. Terdapat dalam berbagai kitab hadis dan fikih. Dibaca sebagai pengakuan atas keistimewaan Nabi ﷺ.'
    },
    {
      id:18, nama:'Sholawat Rifa\'iyah', kategori:'Sholawat Amalan',
      arab:'اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ\nفِي الْأَوَّلِيْنَ وَالْآخِرِيْنَ\nوَفِي الْمَلَأِ الْأَعْلَى إِلَى يَوْمِ الدِّيْنِ\nوَابْعَثْهُ الْمَقَامَ الْمَحْمُودَ الَّذِي وَعَدْتَهُ\nوَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِيْنَ',
      latin:'Allāhumma ṣalli \'alā sayyidinā Muḥammad\nfil-awwalīna wal-ākhirīn\nwa fil-mala\'il-a\'lā ilā yaumid-dīn\nwab\'aṡhul-maqāmal-maḥmūdallażī wa\'adtah\nwa \'alā ālihī wa ṣaḥbihī ajma\'īn',
      arti:'Ya Allah, limpahkanlah sholawat kepada junjungan kami Muhammad\ndi kalangan orang-orang terdahulu dan yang akan datang,\ndan di Mala\'ul A\'la (langit tertinggi) hingga Hari Pembalasan,\ndan bangkitkanlah beliau pada Maqam Mahmud yang telah Engkau janjikan,\ndan kepada seluruh keluarga dan sahabat beliau.',
      keutamaan:'Sholawat dari Thariqah Rifa\'iyah yang mengandung doa agar Nabi ﷺ mendapatkan Maqam Mahmud. Mendoakan Nabi ﷺ mendapatkan Maqam Mahmud adalah sunnah yang diajarkan dalam doa setelah adzan, sesuai hadis shahih riwayat Imam Bukhari.'
    },
    {
      id:19, nama:'Sholawat Tawassul', kategori:'Sholawat Amalan',
      arab:'اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ\nوَتَوَسَّلْنَا بِهِ إِلَيْكَ\nفَاقْبَلْ تَوَسُّلَنَا وَحَقِّقْ آمَالَنَا\nوَاغْفِرْ ذُنُوبَنَا وَاسْتُرْ عُيُوبَنَا\nوَيَسِّرْ أُمُورَنَا بِجَاهِهِ عِنْدَكَ\nوَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ',
      latin:'Allāhumma ṣalli \'alā sayyidinā Muḥammad\nwa tawassalnā bihī ilaik\nfaqbal tawassulunā wa ḥaqqiq āmālanā\nwaġfir żunūbanā wastir \'uyūbanā\nwa yassir umūranā bijāhihī \'indak\nwa \'alā ālihī wa ṣaḥbihī wa sallim',
      arti:'Ya Allah, limpahkanlah sholawat kepada junjungan kami Muhammad,\ndan kami bertawasul dengannya kepada-Mu.\nMaka terimalah tawasul kami dan wujudkanlah harapan-harapan kami,\nampunilah dosa-dosa kami dan tutupilah aib-aib kami,\nmudahkanlah urusan-urusan kami dengan kemuliaannya di sisi-Mu,\ndan kepada keluarga dan sahabat-sahabatnya, serta limpahkanlah salam.',
      keutamaan:'Sholawat Tawassul adalah sholawat sekaligus doa yang mengandung permintaan kepada Allah melalui tawasul Nabi Muhammad ﷺ. Sangat dianjurkan dibaca ketika memiliki hajat besar atau menghadapi kesulitan berat. Dibaca setelah sholat hajat.'
    },
    {
      id:20, nama:'Sholawat Rahmatan Lil \'Alamin', kategori:'Sholawat Amalan',
      arab:'اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ\nعَلَى سَيِّدِنَا مُحَمَّدٍ\nالرَّحْمَةِ الْمُهْدَاةِ\nوَالنِّعْمَةِ الْمُسْدَاةِ\nوَالسِّرَاجِ الْمُنِيرِ\nوَعَلَى آلِهِ وَصَحْبِهِ\nعَدَدَ مَا أَحَاطَ بِهِ عِلْمُكَ',
      latin:'Allāhumma ṣalli wa sallim wa bārik\n\'alā sayyidinā Muḥammad\nar-raḥmatil-muhdāh\nwan-ni\'matil-musdāh\nwas-sirājil-munīr\nwa \'alā ālihī wa ṣaḥbih\n\'adada mā aḥāṭa bihī \'ilmuk',
      arti:'Ya Allah, limpahkanlah sholawat, salam, dan keberkahan\nkepada junjungan kami Muhammad,\nrahmat yang dihadiahkan (kepada seluruh alam),\nnikmat yang dilimpahkan,\ndan pelita yang menerangi,\nbeserta keluarga dan sahabat-sahabatnya,\nsebanyak bilangan yang diliputi oleh ilmu-Mu.',
      keutamaan:'Sholawat ini merangkum tiga sifat utama Nabi Muhammad ﷺ: rahmat bagi semesta alam (QS. Al-Anbiya: 107), nikmat yang dilimpahkan, dan pelita yang menerangi (QS. Al-Ahzab: 46). Dibaca sebagai wirid harian untuk memperoleh keberkahan yang tak terhitung jumlahnya.'
    },
    {
      id:21, nama:'Sholawat Tarhim', kategori:'Sholawat Populer',
      arab:'اَلصَّلاَةُ وَالسَّلاَمُ عَلَيْكَ يَاإِمَامَ الْمُجَاهِدِيْنَ يَارَسُوْلَ اللهِ\nاَلصَّلاَةُ وَالسَّلاَمُ عَلَيْكَ يَانَاصِرَ الْهُدَى يَاخَيْرَ خَلْقِ اللهِ\nاَلصَّلاَةُ وَالسَّلاَمُ عَلَيْكَ يَانَاصِرَ الْحَقِّ يَارَسُوْلَ اللهِ\nاَلصَّلاَةُ وَالسَّلاَمُ عَلَيْكَ يَامَنْ أَسْرَى بِكَ مُهَيْمِنُ\nلَيْلاً نِلْتَ مَانِلْتَ وَالْأَنَامُ نِيَامٌ\nوَتَقَدَّمْتَ لِلصَّلاَةِ فَصَلَّى كُلُّ مَنْ فِى السَّمَاءِ وَأَنْتَ الْإِمَامُ\nوَإِلَى الْمُنْتَهَى رُفِعْتَ كَرِيْمًا وَسَمِعْتَ نِدَاءً عَلَيْكَ السَّلاَمُ\nيَاكَرِيْمَ الْأَخْلاَقِ يَارَسُوْلَ اللهِ\nصَلَّى عَلَيْكَ اللهُ وَعَلَى آلِكَ وَصَحْبِكَ يَارَسُوْلَ اللهِ',
      latin:'Ash-shalātu was-salāmu \'alayka yā imāmal-mujāhidīn, yā rasūlallāh\nAsh-shalātu was-salāmu \'alayka yā nāṣiral-hudā, yā khaira khalqillāh\nAsh-shalātu was-salāmu \'alayka yā nāṣiral-ḥaqqi, yā rasūlallāh\nAsh-shalātu was-salāmu \'alayka yā man asrā bika muhaimin\nLailan nilta mā nilta wal-anāmu niyām\nWa taqaddamta lish-shalāti fa ṣallā kullu man fis-samā\'i wa antal-imām\nWa ilal-muntahā rufi\'ta karīman wa sami\'ta nidā\'an \'alaikas-salām\nYā karīmal-akhlāqi yā rasūlallāh\nṢallā \'alaykallāhu wa \'alā ālika wa ṣaḥbika yā rasūlallāh',
      arti:'Sholawat dan salam semoga tercurah atasmu, wahai pemimpin para pejuang, wahai Rasulullah.\nSholawat dan salam semoga tercurah atasmu, wahai penolong petunjuk, wahai sebaik-baik makhluk Allah.\nSholawat dan salam semoga tercurah atasmu, wahai penolong kebenaran, wahai Rasulullah.\nSholawat dan salam semoga tercurah atasmu, wahai yang diperjalankan (Isra\') oleh Yang Maha Melindungi.\nDi malam hari engkau memperoleh apa yang engkau peroleh, sedang manusia dalam keadaan tidur.\nEngkau maju menjadi imam sholat, maka sholatlah seluruh penghuni langit di belakangmu dan engkau menjadi imam.\nHingga ke Sidratul Muntaha engkau diangkat dengan mulia, dan engkau mendengar seruan salam atasmu.\nWahai yang paling mulia akhlaknya, wahai Rasulullah,\nsemoga Allah melimpahkan sholawat kepadamu, dan kepada keluarga serta sahabatmu, wahai Rasulullah.',
      keutamaan:'Sholawat Tarhim disusun oleh Syekh Mahmoud Khalil Al-Hussary, seorang qari terkemuka dari Mesir, dan populer di kalangan warga Nahdlatul Ulama. Sholawat ini biasa dikumandangkan menjelang adzan Subuh atau saat imsak di bulan Ramadhan untuk membangunkan umat Islam bersiap sholat, sekaligus mengenang peristiwa Isra Mi\'raj.'
    },
    {
      id:22, nama:'Sholawat Asyghil', kategori:'Sholawat Amalan',
      arab:'اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ\nوَأَشْغِلِ الظَّالِمِينَ بِالظَّالِمِينَ\nوَأَخْرِجْنَا مِنْ بَيْنِهِمْ سَالِمِينَ\nوَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِينَ',
      latin:'Allāhumma ṣalli \'alā sayyidinā Muḥammad\nwa asyghilidh-dhālimīna bidh-dhālimīn\nwa akhrijnā min bainihim sālimīn\nwa \'alā ālihī wa ṣaḥbihī ajma\'īn',
      arti:'Ya Allah, limpahkanlah sholawat kepada junjungan kami Muhammad,\ndan sibukkanlah orang-orang zalim dengan sesama orang zalim,\ndan keluarkanlah kami dari tengah-tengah mereka dalam keadaan selamat,\ndan kepada keluarga dan seluruh sahabatnya.',
      keutamaan:'Sholawat Asyghil sering dinisbatkan kepada Imam Ja\'far ash-Shadiq, disusun pada masa umat menghadapi tekanan dan kezaliman penguasa. "Asyghil" berarti "sibukkan" — dibaca sebagai doa memohon agar orang-orang zalim disibukkan dengan sesamanya sehingga umat yang beriman selamat. Populer dibaca setelah adzan hingga iqamah di kalangan Nahdliyin.'
    }
  ];

  var listEl = document.getElementById('sholawatList');
  listEl.innerHTML = DATA.map(function(s){
    return '<button class="sh-item" id="shi-'+s.id+'" onclick="bukaSholawat('+s.id+')">' +
      '<div class="sh-num">'+s.id+'</div>' +
      '<div class="sh-text"><div class="sh-name">'+s.nama+'</div><div class="sh-info">'+s.kategori+'</div></div>' +
      '</button>';
  }).join('');

  window.bukaSholawat = function(id){
    var s = DATA.find(function(x){return x.id===id;});
    if(!s) return;
    document.querySelectorAll('.sh-item').forEach(function(b){b.classList.remove('aktif');});
    var btn = document.getElementById('shi-'+id);
    if(btn){btn.classList.add('aktif');btn.scrollIntoView({block:'nearest',behavior:'smooth'});}
    var idx = DATA.findIndex(function(x){return x.id===id;});
    var prevId = idx > 0 ? DATA[idx-1].id : null;
    var nextId = idx < DATA.length-1 ? DATA[idx+1].id : null;
    document.getElementById('mainContent').innerHTML =
      '<div class="content-header">' +
        '<div class="ch-badge">✦ '+s.kategori+' ✦</div>' +
        '<div class="ch-title">'+s.nama+'</div>' +
        '<div class="ch-sub">Sholawat ke-'+s.id+' dari '+DATA.length+'</div>' +
      '</div>' +
      '<div class="content-body">' +
        '<div class="arab-box"><div class="arab-text">'+s.arab+'</div></div>' +
        '<div class="section-label">Latin / Transliterasi</div>' +
        '<div class="latin-box">'+s.latin+'</div>' +
        '<div class="section-label">Terjemahan</div>' +
        '<div class="arti-box">'+s.arti+'</div>' +
        '<div class="section-label">Keutamaan &amp; Keterangan</div>' +
        '<div class="keutamaan-box"><strong>💡 </strong>'+s.keutamaan+'</div>' +
        '<div class="nav-arrows">' +
          '<button class="nav-btn" '+(prevId ? 'onclick="bukaSholawat('+prevId+')"' : 'disabled')+'>← Sebelumnya</button>' +
          '<button class="nav-btn" '+(nextId ? 'onclick="bukaSholawat('+nextId+')"' : 'disabled')+'>Berikutnya →</button>' +
        '</div>' +
      '</div>';
  };

  bukaSholawat(1);
})();
</script>
</body>
</html>
